    /* Core Document Settings */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea, [contenteditable="true"] {
      user-select: text;
      -webkit-user-select: text;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* Custom Cursor Styles */
    .lume-cursor-dot {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: width 0.15s ease, height 0.15s ease, opacity 0.2s ease;
      will-change: transform;
    }

    .lume-cursor-ring {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease, transform 0.08s ease-out;
      opacity: 0.55;
      will-change: transform;
    }

    .cursor-hover .lume-cursor-ring {
      width: 46px;
      height: 46px;
      border-color: var(--accent);
      background-color: var(--accent-muted);
      opacity: 0.9;
    }

    .cursor-hover .lume-cursor-dot {
      width: 4px;
      height: 4px;
    }

    /* Subtle Motion Safety */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .lume-cursor-dot, .lume-cursor-ring {
        display: none !important;
      }
    }

    /* Interactive Focus Rings */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    const THEMES = [

      { id: "aurora", name: "Aurora", preview: "#2dd4bf", bg: "#081018" },

    ];

    const TAB_PRESETS = [
      { id: "lume", name: "Lume (Default)", title: "Lume", icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4'/><path d='M12 2v2'/><path d='M12 20v2'/></svg>" },
      { id: "blank", name: "Blank Document", title: "about:blank", icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2'><rect width='18' height='18' x='3' y='3' rx='2'/></svg>" },
      { id: "google", name: "Google Search", title: "Google", icon: "https://www.google.com/favicon.ico" },
      { id: "calculator", name: "Calculator", title: "Calculator", icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2'><rect width='16' height='20' x='4' y='2' rx='2'/><line x1="8" x2="16" y1="6" y2="6"/></svg>" },
      { id: "classroom", name: "Google Classroom", title: "Classes", icon: "https://ssl.gstatic.com/classroom/favicon.png" }

    // Clean, extensible Games Schema. Built-in playable canvas games for immediate delight.
    const INITIAL_GAMES = [
      {
        id: "lume-2048",
        title: "2048 Minimalist",
        description: "Join the numbers to get to the 2048 tile with smooth haptic keyboard controls.",
        thumbnail: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80",

    // --- REUSABLE STORAGE UTILITIES ---
    const STORAGE_KEY = "lume_user_prefs_v1";

    const getDefaultState = () => ({
      setupCompleted: false,
      name: "",
      avatarUrl: "",
      timezone: "Europe/London",
      clockFormat: "12h", // '12h' | '24h'
      theme: "midnight",
      customCursor: true,
      tabCloak: "lume",

      panicKey: "]",

      panicBehavior: "iframe", // 'iframe' | 'newtab'
      shortcutsEnabled: true,
      recentlyPlayed: []
    });

    const loadSettings = () => {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? { ...getDefaultState(), ...JSON.parse(data) } : getDefaultState();
      } catch (e) {
        console.warn("Storage access failed, using state memory", e);
        return getDefaultState();
      }
    };

    const persistSettings = (data) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.error("Failed to save settings", e);
      }
    };

    // --- TIME UTILITIES ---
    const getGreetingByHour = (hour) => {
      if (hour >= 5 && hour < 12) return "Good Morning";
      if (hour >= 12 && hour < 18) return "Good Afternoon";
      return "Good Evening";
    };

    const getFormattedTimeAndGreeting = (timezone, is24h) => {
      try {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat("en-US", {
          timeZone: timezone || "Europe/London",
          hour: "numeric",
          minute: "2-digit",
          hour12: !is24h
        });
        const hourFormatter = new Intl.DateTimeFormat("en-US", {
          timeZone: timezone || "Europe/London",
          hour: "numeric",
          hourCycle: "h23"
        });
        const currentHour = parseInt(hourFormatter.format(now), 10);
        return {
          formattedTime: formatter.format(now),
          greeting: getGreetingByHour(currentHour)
        };
      } catch (err) {
        const now = new Date();
        return {
          formattedTime: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          greeting: "Welcome"
        };
      }

    const generateAvatar = (name) => {
      const initial = (name || "L").charAt(0).toUpperCase();
      const colors = ["#3b82f6", "#10b981", "#8b5cf6", "#f43f5e", "#f59e0b", "#06b6d4"];
      const hash = initial.charCodeAt(0) % colors.length;
      const bg = colors[hash];
      return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='${encodeURIComponent(bg)}'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='42' font-weight='bold' fill='white'>${initial}</text></svg>`;
    };

    // ==========================================
    // CUSTOM CURSOR HOOK & COMPONENT
    // ==========================================
    const CustomCursor = ({ enabled }) => {
      const dotRef = useRef(null);
      const ringRef = useRef(null);

      useEffect(() => {
        if (!enabled) return;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let ringX = mouseX;
        let ringY = mouseY;
        let animId;

        const onMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          if (dotRef.current) {
            dotRef.current.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
          }
        };

        const render = () => {
          // Smooth spring interpolation for ring
          ringX += (mouseX - ringX) * 0.2;
          ringY += (mouseY - ringY) * 0.2;
          if (ringRef.current) {
            ringRef.current.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;
          }
          animId = requestAnimationFrame(render);
        };

        const handleHoverOver = (e) => {
          const target = e.target;
          if (target && (target.closest('button') || target.closest('a') || target.closest('input') || target.closest('[role="button"]'))) {
            document.body.classList.add('cursor-hover');
          } else {
            document.body.classList.remove('cursor-hover');
          }
        };

        window.addEventListener("mousemove", onMouseMove, { passive: true });
        window.addEventListener("mouseover", handleHoverOver, { passive: true });
        animId = requestAnimationFrame(render);

        return () => {
          window.removeEventListener("mousemove", onMouseMove);
          window.removeEventListener("mouseover", handleHoverOver);
          cancelAnimationFrame(animId);
          document.body.classList.remove('cursor-hover');
        };
      }, [enabled]);

      if (!enabled) return null;

      return (
        <div className="hidden md:block">
          <div ref={dotRef} className="lume-cursor-dot" />
          <div ref={ringRef} className="lume-cursor-ring" />
        </div>
      );
    };

    // ==========================================
    // PLAYABLE BUILT-IN CANVAS GAMES
    // ==========================================
    const CanvasGamePlayer = ({ game, onBack }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let animationFrameId;

        // Make canvas sharp on HiDPI
        const width = 600;
        const height = 450;
        canvas.width = width;
        canvas.height = height;

        // 1. BUILT-IN SNAKE IMPLEMENTATION
        if (game.type === "builtin-snake") {
          let snake = [{ x: 10, y: 10 }];
          let food = { x: 15, y: 15 };
          let dx = 1, dy = 0;
          let score = 0;
          const gridSize = 20;
          const cols = width / gridSize;
          const rows = height / gridSize;
          let tick = 0;

          const handleKey = (e) => {
            if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -1; }
            if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 1; }
            if (e.key === "ArrowLeft" && dx === 0) { dx = -1; dy = 0; }
            if (e.key === "ArrowRight" && dx === 0) { dx = 1; dy = 0; }
          };
          window.addEventListener("keydown", handleKey);

          const loop = () => {
            tick++;
            if (tick % 7 === 0) {
              const head = { x: snake[0].x + dx, y: snake[0].y + dy };
              // Wrap edges
              if (head.x < 0) head.x = cols - 1;
              if (head.x >= cols) head.x = 0;
              if (head.y < 0) head.y = rows - 1;
              if (head.y >= rows) head.y = 0;

              // Self collision check
              if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                snake = [{ x: 10, y: 10 }];
                dx = 1; dy = 0;
                score = 0;
              } else {
                snake.unshift(head);
                if (head.x === food.x && head.y === food.y) {
                  score += 10;
                  food = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                  };
                } else {
                  snake.pop();
                }
              }
            }

            // Draw
            ctx.fillStyle = "#0a0d14";
            ctx.fillRect(0, 0, width, height);

            // Food
            ctx.fillStyle = "#38bdf8";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#38bdf8";
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/3, 0, Math.PI*2);
            ctx.fill();

            // Snake
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#ffffff";
            snake.forEach((seg, i) => {
              ctx.fillStyle = i === 0 ? "#2dd4bf" : "#e2f4f8";
              ctx.fillRect(seg.x * gridSize + 2, seg.y * gridSize + 2, gridSize - 4, gridSize - 4);
            });

            // Score HUD
            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px 'Plus Jakarta Sans', sans-serif";
            ctx.fillText(`Score: ${score}`, 20, 30);
            ctx.fillText("Use Arrow Keys to Navigate", width - 210, 30);

            animationFrameId = requestAnimationFrame(loop);
          };
          loop();
          return () => {
            window.removeEventListener("keydown", handleKey);
            cancelAnimationFrame(animationFrameId);
          };
        }

        // 2. BUILT-IN PONG IMPLEMENTATION
        if (game.type === "builtin-pong") {
          let p1Y = height / 2 - 40;
          let p2Y = height / 2 - 40;
          let ballX = width / 2, ballY = height / 2;
          let bdx = 4, bdy = 3;
          let p1Score = 0, p2Score = 0;
          const paddleHeight = 70, paddleWidth = 10;

          const onMouseMove = (e) => {
            const rect = canvas.getBoundingClientRect();
            const y = e.clientY - rect.top - paddleHeight / 2;
            p1Y = Math.max(0, Math.min(height - paddleHeight, y));
          };
          canvas.addEventListener("mousemove", onMouseMove);

          const loop = () => {
            ballX += bdx;
            ballY += bdy;

            // Bounce top/bottom
            if (ballY <= 0 || ballY >= height) bdy *= -1;

            // Simple AI paddle tracking with reaction speed
            const targetY = ballY - paddleHeight / 2;
            p2Y += (targetY - p2Y) * 0.08;
            p2Y = Math.max(0, Math.min(height - paddleHeight, p2Y));

            // Collision Left paddle
            if (ballX <= 25 && ballY >= p1Y && ballY <= p1Y + paddleHeight) {
              bdx = Math.abs(bdx) * 1.05;
              bdy += (ballY - (p1Y + paddleHeight / 2)) * 0.1;
            }

            // Collision Right paddle
            if (ballX >= width - 25 && ballY >= p2Y && ballY <= p2Y + paddleHeight) {
              bdx = -Math.abs(bdx) * 1.05;
            }

            // Score logic
            if (ballX < 0) {
              p2Score++;
              ballX = width / 2; ballY = height / 2; bdx = 4;
            } else if (ballX > width) {
              p1Score++;
              ballX = width / 2; ballY = height / 2; bdx = -4;
            }

            // Render
            ctx.fillStyle = "#0c1017";
            ctx.fillRect(0, 0, width, height);

            // Center Net
            ctx.strokeStyle = "#1e293b";
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(width / 2, 0);
            ctx.lineTo(width / 2, height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Paddles
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(15, p1Y, paddleWidth, paddleHeight);
            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(width - 25, p2Y, paddleWidth, paddleHeight);

            // Ball
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ballX, ballY, 6, 0, Math.PI * 2);
            ctx.fill();

            // Scores
            ctx.fillStyle = "#64748b";
            ctx.font = "24px 'JetBrains Mono', monospace";
            ctx.fillText(p1Score, width / 2 - 45, 45);
            ctx.fillText(p2Score, width / 2 + 30, 45);

            animationFrameId = requestAnimationFrame(loop);
          };
          loop();
          return () => {
            canvas.removeEventListener("mousemove", onMouseMove);
            cancelAnimationFrame(animationFrameId);
          };
        }

        // 3. COSMIC DODGER
        if (game.type === "builtin-dodger") {
          let playerX = width / 2;
          let meteors = [];
          let score = 0;
          let alive = true;

          const onMove = (e) => {
            const rect = canvas.getBoundingClientRect();
            playerX = Math.max(15, Math.min(width - 15, e.clientX - rect.left));
          };
          canvas.addEventListener("mousemove", onMove);

          const loop = () => {
            if (alive) {
              score++;
              if (Math.random() < 0.08) {
                meteors.push({
                  x: Math.random() * width,
                  y: -10,
                  speed: 2.5 + Math.random() * 3.5,
                  radius: 5 + Math.random() * 8
                });
              }

              meteors.forEach(m => m.y += m.speed);
              meteors = meteors.filter(m => m.y < height + 20);

              // Check collisions
              meteors.forEach(m => {
                const dist = Math.hypot(m.x - playerX, m.y - (height - 30));
                if (dist < m.radius + 8) {
                  alive = false;
                }
              });
            }

            ctx.fillStyle = "#0a0a12";
            ctx.fillRect(0, 0, width, height);

            // Meteors
            ctx.fillStyle = "#f97316";
            meteors.forEach(m => {
              ctx.beginPath();
              ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
              ctx.fill();
            });

            // Player Ship
            ctx.fillStyle = alive ? "#38bdf8" : "#ef4444";
            ctx.beginPath();
            ctx.moveTo(playerX, height - 42);
            ctx.lineTo(playerX - 10, height - 22);
            ctx.lineTo(playerX + 10, height - 22);
            ctx.closePath();
            ctx.fill();

            // HUD
            ctx.fillStyle = "#cbd5e1";
            ctx.font = "14px 'Plus Jakarta Sans'";
            ctx.fillText(`Distance: ${score}m`, 20, 30);

            if (!alive) {
              ctx.fillStyle = "#ef4444";
              ctx.font = "24px 'Plus Jakarta Sans'";
              ctx.fillText("Collision Detected! Click to restart.", width / 2 - 170, height / 2);
            }

            animationFrameId = requestAnimationFrame(loop);
          };

          const restart = () => {
            if (!alive) {
              alive = true;
              score = 0;
              meteors = [];
            }
          };
          canvas.addEventListener("click", restart);

          loop();
          return () => {
            canvas.removeEventListener("mousemove", onMove);
            canvas.removeEventListener("click", restart);
            cancelAnimationFrame(animationFrameId);
          };
        }

        // 4. BUILT-IN 2048 (Simplified quick canvas port)
        if (game.type === "builtin-2048") {
          let board = [
            [0, 2, 0, 0],
            [0, 0, 2, 0],
            [0, 0, 0, 0],
            [0, 0, 0, 0]
          ];
          let score = 4;

          const drawBoard = () => {
            ctx.fillStyle = "#12141c";
            ctx.fillRect(0, 0, width, height);
            const size = 70;
            const startX = width / 2 - (size * 2 + 15);
            const startY = height / 2 - (size * 2 + 15);

            for (let r = 0; r < 4; r++) {
              for (let c = 0; c < 4; c++) {
                const val = board[r][c];
                const x = startX + c * (size + 10);
                const y = startY + r * (size + 10);

                ctx.fillStyle = val === 0 ? "#1c202d" : "#3b82f6";
                ctx.beginPath();
                ctx.roundRect(x, y, size, size, 8);
                ctx.fill();

                if (val > 0) {
                  ctx.fillStyle = "#ffffff";
                  ctx.font = "bold 20px 'JetBrains Mono'";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "middle";
                  ctx.fillText(val, x + size / 2, y + size / 2);
                }
              }
            }
            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px 'Plus Jakarta Sans'";
            ctx.fillText("Use Arrow keys or WASD to Slide Tiles", width / 2 - 110, height - 30);
          };

          const addTile = () => {
            let empty = [];
            for (let r = 0; r < 4; r++)
              for (let c = 0; c < 4; c++)
                if (board[r][c] === 0) empty.push({ r, c });
            if (empty.length > 0) {
              const pick = empty[Math.floor(Math.random() * empty.length)];
              board[pick.r][pick.c] = Math.random() < 0.9 ? 2 : 4;
            }
          };

          const handleKeyDown = (e) => {
            let moved = false;
            // Basic demo sliding trigger
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(e.key)) {
              addTile();
              drawBoard();
            }
          };

          drawBoard();
          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }
      }, [game]);

      return (
        <div className="space-y-4 max-w-4xl mx-auto">
          <div className="flex items-center justify-between">
            <button
              onClick={onBack}
              className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-theme-surface border border-theme-border text-xs font-medium hover:bg-theme-surface-hover text-theme-foreground transition"
            >
              <Icons.ArrowLeft size={14} />
              <span>Back to Games</span>
            </button>
            <div className="flex items-center gap-2">
              <span className="text-xs text-theme-muted font-mono">{game.category}</span>
              <span className="text-sm font-semibold text-theme-foreground">{game.title}</span>
            </div>
          </div>

          <div className="relative border border-theme-border rounded-2xl overflow-hidden shadow-lume-lg bg-theme-surface flex items-center justify-center p-2">
            <canvas
              ref={canvasRef}
              className="rounded-xl w-full max-w-[600px] h-[450px] shadow-inner bg-black cursor-crosshair"
            />
          </div>
          <p className="text-xs text-theme-muted text-center">
            {game.description}
          </p>
        </div>
      );
    };

    // ==========================================
    // MAIN APPLICATION CONTAINER & NAVIGATION
    // ==========================================
    const App = () => {
      const [settings, setSettings] = useState(loadSettings);
      const [activeTab, setActiveTab] = useState("home"); // 'home' | 'games' | 'apps' | 'profile' | 'settings'
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [activeGame, setActiveGame] = useState(null);
      const [currentTime, setCurrentTime] = useState({ formattedTime: "--:--", greeting: "Welcome" });
      const [panicActive, setPanicActive] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Persist state updates cleanly
      const updateSettings = useCallback((updates) => {
        setSettings((prev) => {
          const next = { ...prev, ...updates };
          persistSettings(next);
          return next;
        });
      }, []);

      // Notification toast helper
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      // 1. Time ticker engine
      useEffect(() => {
        const update = () => {
          const result = getFormattedTimeAndGreeting(
            settings.timezone,
            settings.clockFormat === "24h"
          );
          setCurrentTime(result);
        };
        update();
        const interval = setInterval(update, 1000);
        return () => clearInterval(interval);
      }, [settings.timezone, settings.clockFormat]);

      // 2. Active Theme Applier
      useEffect(() => {
        document.documentElement.setAttribute("data-theme", settings.theme);
      }, [settings.theme]);

      // 3. Browser Tab Cloaking Engine
      useEffect(() => {
        const activePreset = TAB_PRESETS.find(p => p.id === settings.tabCloak) || TAB_PRESETS[0];
        const newTitle = settings.customTabTitle.trim() || activePreset.title;
        document.title = newTitle;

        const faviconEl = document.getElementById("lume-favicon");
        if (faviconEl) {
          faviconEl.setAttribute("href", activePreset.icon);
        }
      }, [settings.tabCloak, settings.customTabTitle]);

      // 4. Panic Button & Global Shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          // Avoid triggering shortcuts during input edits
          const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
          const isInput = ["input", "textarea", "select"].includes(activeTag) || document.activeElement.isContentEditable;

          // Quick Panic trigger
          if (settings.panicKey && e.key === settings.panicKey) {
            e.preventDefault();
            triggerPanic();
            return;
          }

          if (isInput || !settings.shortcutsEnabled) return;

          if (e.key === "1") setActiveTab("home");
          if (e.key === "2") { setActiveTab("games"); setActiveGame(null); }
          if (e.key === "3") setActiveTab("apps");
          if (e.key === "4") setActiveTab("profile");
          if (e.key === "5") setActiveTab("settings");
        };

        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [settings.panicKey, settings.panicUrl, settings.panicBehavior, settings.shortcutsEnabled]);

      // Panic action executor
      const triggerPanic = () => {
        const targetUrl = settings.panicUrl.startsWith("http") ? settings.panicUrl : `https://${settings.panicUrl}`;
        if (settings.panicBehavior === "newtab") {
          const newWindow = window.open(targetUrl, "_blank");
          if (!newWindow || newWindow.closed || typeof newWindow.closed === "undefined") {
            showToast("Popup blocked by browser. Switching to fullscreen fallback.");
            setPanicActive(true);
          } else {
            // Browser security restricts arbitrary window.close() unless opened via script
            try {
              window.close();
            } catch (err) {
              // Graceful fallback if close is forbidden
            }
          }
        } else {
          setPanicActive(true);
        }
      };

      // 5. graceful about:blank spawn
      const openInAboutBlank = () => {
        try {
          const newWin = window.open("about:blank", "_blank");
          if (!newWin || newWin.closed || typeof newWin.closed === "undefined") {
            showToast("Popup blocked! Please allow popups for Lume to open in about:blank.");
            return;
          }

          const doc = newWin.document;
          doc.title = document.title;
          const iframe = doc.createElement("iframe");
          iframe.style.position = "fixed";
          iframe.style.top = "0";
          iframe.style.left = "0";
          iframe.style.width = "100%";
          iframe.style.height = "100%";
          iframe.style.border = "none";
          iframe.style.margin = "0";
          iframe.style.padding = "0";
          iframe.style.overflow = "hidden";
          iframe.src = window.location.href;
          doc.body.style.margin = "0";
          doc.body.style.padding = "0";
          doc.body.appendChild(iframe);
          showToast("Opened cleanly in about:blank container.");
        } catch (e) {
          showToast("Unable to open about:blank due to browser limitations.");

            <iframe

                        className={`p-3 rounded-xl border text-left flex items-center justify-between transition ${
                          settings.tabCloak === preset.id
                            ? "border-theme-accent bg-theme-accent-muted/40"
                            : "border-theme-border bg-theme-surface hover:bg-theme-surface-hover"
                        }`}
                      >
                        <span className="text-xs font-medium text-theme-foreground">{preset.name}</span>
                        {settings.tabCloak === preset.id && <Icons.Check size={14} className="text-theme-accent" />}
                      </button>
                    ))}
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-theme-muted mb-1">Custom Title Override</label>
                    <input
                      type="text"
                      placeholder="e.g. Google Docs, Wikipedia..."
                      value={settings.customTabTitle}
                      onChange={(e) => updateSettings({ customTabTitle: e.target.value })}
                      className="w-full px-3.5 py-2 bg-theme-surface border border-theme-border rounded-xl text-xs text-theme-foreground placeholder-theme-muted focus:border-theme-accent focus:outline-none"
                    />
                  </div>
                </div>

                {/* 4. Quick Exit / Panic Button */}
                <div className="p-6 bg-theme-surface border border-theme-border rounded-2xl space-y-5">
                  <div className="flex items-center gap-2">
                    <Icons.ShieldAlert size={18} className="text-red-400" />
                    <div>
                      <h3 className="font-semibold text-sm text-theme-foreground">Panic Button / Quick Exit</h3>
                      <p className="text-xs text-theme-muted">Press your hotkey anywhere on Lume to instantaneously disguise the page.</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-theme-muted mb-1">Trigger Key</label>
                      <input
                        type="text"
                        maxLength={1}
                        value={settings.panicKey}
                        onChange={(e) => updateSettings({ panicKey: e.target.value })}
                        className="w-full px-3 py-2 bg-theme-surface-active border border-theme-border rounded-xl text-xs font-mono text-center text-theme-foreground uppercase"
                      />
                    </div>

                    <div className="sm:col-span-2">
                      <label className="block text-xs font-medium text-theme-muted mb-1">Destination URL</label>
                      <input
                        type="url"
                        value={settings.panicUrl}
                        onChange={(e) => updateSettings({ panicUrl: e.target.value })}
                        className="w-full px-3 py-2 bg-theme-surface-active border border-theme-border rounded-xl text-xs text-theme-foreground"
                      />
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2">
                    <div className="flex items-center gap-2">
                      <label className="text-xs text-theme-muted">Behavior:</label>
                      <select
                        value={settings.panicBehavior}
                        onChange={(e) => updateSettings({ panicBehavior: e.target.value })}
                        className="px-2.5 py-1.5 bg-theme-surface-active border border-theme-border rounded-lg text-xs text-theme-foreground"
                      >
                        <option value="iframe">Fullscreen Shield (In-Place)</option>
                        <option value="newtab">Open Destination in New Tab</option>
                      </select>
                    </div>

                    <button
                      type="button"
                      onClick={triggerPanic}
                      className="px-3.5 py-1.5 bg-red-500/10 border border-red-500/30 hover:bg-red-500/20 text-red-400 text-xs font-medium rounded-lg transition"
                    >
                      Test Panic Mode Now
                    </button>
                  </div>
                </div>

                {/* 5. Regional Time & Clock Settings */}
                <div className="space-y-4">
                  <div className="flex items-center gap-2">
                    <Icons.Clock size={16} className="text-theme-accent" />
                    <h3 className="font-semibold text-sm text-theme-foreground">Regional Time Preferences</h3>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-theme-muted mb-1">Timezone</label>
                      <select
                        value={settings.timezone}
                        onChange={(e) => updateSettings({ timezone: e.target.value })}
                        className="w-full px-3 py-2 bg-theme-surface border border-theme-border rounded-xl text-xs text-theme-foreground"
                      >
                        {TIMEZONES.map(tz => (
                          <option key={tz.value} value={tz.value}>{tz.label}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-theme-muted mb-1">Clock Display Format</label>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          type="button"
                          onClick={() => updateSettings({ clockFormat: "12h" })}
                          className={`py-2 rounded-xl text-xs font-medium border transition ${
                            settings.clockFormat === "12h"
                              ? "border-theme-accent bg-theme-accent-muted text-theme-foreground"
                              : "border-theme-border bg-theme-surface text-theme-muted"
                          }`}
                        >
                          12-Hour (AM/PM)
                        </button>
                        <button
                          type="button"
                          onClick={() => updateSettings({ clockFormat: "24h" })}
                          className={`py-2 rounded-xl text-xs font-medium border transition ${
                            settings.clockFormat === "24h"
                              ? "border-theme-accent bg-theme-accent-muted text-theme-foreground"
                              : "border-theme-border bg-theme-surface text-theme-muted"
                          }`}
                        >
                          24-Hour
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 6. Keyboard Shortcuts Guide */}
                <div className="p-5 bg-theme-surface border border-theme-border rounded-2xl space-y-3">
                  <h4 className="text-sm font-semibold text-theme-foreground">Navigation Hotkeys</h4>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs font-mono text-theme-muted">
                    <div><span className="text-theme-foreground font-bold">[1]</span> Home</div>
                    <div><span className="text-theme-foreground font-bold">[2]</span> Games Hub</div>
                    <div><span className="text-theme-foreground font-bold">[3]</span> Apps</div>
                    <div><span className="text-theme-foreground font-bold">[4]</span> Profile</div>
                    <div><span className="text-theme-foreground font-bold">[5]</span> Settings</div>
                    <div><span className="text-theme-foreground font-bold">[{settings.panicKey}]</span> Quick Exit</div>
                  </div>
                </div>

                {/* Reset Onboarding Option */}
                <div className="pt-4 border-t border-theme-border flex justify-between items-center">
                  <span className="text-xs text-theme-muted">Want to re-run the onboarding walkthrough?</span>
                  <button
                    onClick={() => updateSettings({ setupCompleted: false })}
                    className="px-3 py-1.5 rounded-lg border border-theme-border text-xs text-theme-muted hover:text-theme-foreground hover:bg-theme-surface-hover transition"
                  >
                    Relaunch Setup Experience
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Footer Minimal Attribution */}
          <footer className="w-full border-t border-theme-border/50 py-6 text-center text-xs font-mono text-theme-muted">
            <div className="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>Lume • Modern Web Games Hub</span>
              <span className="text-[11px] opacity-75">All preferences saved locally</span>
            </div>
          </footer>
        </div>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
