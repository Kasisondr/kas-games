<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparx Maths</title>
    <meta name="description" content="uk-www.securly.com">
    <link rel="icon" href="https://intercom-help.eu/sparx-maths-help-centre/assets/favicon" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg-1: #06060a;
            --bg-2: #0d0d15;
            --bg-3: #161625;
            --color-1: #27273a;
            --color-2: #1e1e30;
            --color-3: #181828;
            --color-4: #10101c;
            --neon-glow: rgba(120, 100, 255, 0.5);
            --accent: #7c6ff7;
            --accent-2: #a78bfa;
            --card-bg: rgba(22, 22, 37, 0.7);
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c8;
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-bg: rgba(18, 18, 30, 0.75);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-1);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.6s, color 0.6s;
            user-select: none;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Animated Background */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        /* Ambient glow orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: -1;
            animation: orbFloat 12s ease-in-out infinite;
            opacity: 0.4;
        }

        .ambient-orb.orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(120, 100, 255, 0.35) 0%, transparent 70%);
            top: -15%;
            left: -10%;
            animation-delay: 0s;
        }

        .ambient-orb.orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.25) 0%, transparent 70%);
            bottom: -10%;
            right: -8%;
            animation-delay: -5s;
        }

        .ambient-orb.orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(200, 120, 255, 0.3) 0%, transparent 70%);
            top: 40%;
            left: 50%;
            animation-delay: -9s;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(60px, -40px) scale(1.15);
            }

            50% {
                transform: translate(-30px, -80px) scale(0.9);
            }

            75% {
                transform: translate(-50px, 30px) scale(1.1);
            }
        }

        /* Snow Effect */
        .snowflake {
            position: fixed;
            top: -10px;
            z-index: 9999;
            user-select: none;
            cursor: default;
            animation: fall linear infinite;
            color: #fff;
            font-size: 1em;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 6px rgba(200, 200, 255, 0.7), 0 0 20px rgba(180, 170, 255, 0.4);
            pointer-events: none;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 64px;
            margin: 10px;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #e0dcff 0%, #b8b0ff 30%, #8b83ff 60%, #c4bfff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(140, 130, 255, 0.4));
        }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            margin: 8px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        h3 {
            font-size: 22px;
            margin: 4px;
            font-weight: 600;
            color: var(--text-primary);
        }

        a {
            color: var(--accent-2);
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #d4ccff;
        }

        button {
            cursor: pointer;
            transition: all 0.35s var(--transition-smooth);
            font-family: 'Inter', sans-serif;
            border: none;
            position: relative;
            overflow: hidden;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        button::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.35s;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            pointer-events: none;
        }

        button:hover::after {
            opacity: 1;
        }

        button:active {
            transform: scale(0.96);
        }

        #settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 22px;
            background: var(--glass-bg);
            border-radius: 30px;
            color: var(--text-primary);
            z-index: 1000;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            font-weight: 500;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.4s var(--transition-smooth);
        }

        #settings-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(120, 100, 255, 0.25), 0 8px 20px rgba(0, 0, 0, 0.5);
            border-color: rgba(140, 130, 255, 0.4);
            background: rgba(28, 26, 46, 0.85);
        }

        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .welcome-subtitle {
            color: var(--text-secondary);
            font-size: 1.1em;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .welcome-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 28px;
            justify-content: center;
            z-index: 1;
        }

        .welcome-buttons button {
            padding: 16px 36px;
            border-radius: 30px;
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 1.1em;
            font-weight: 600;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.4s var(--transition-smooth);
            letter-spacing: 0.5px;
        }

        .welcome-buttons button:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 45px rgba(120, 100, 255, 0.3), 0 6px 20px rgba(0, 0, 0, 0.5);
            border-color: rgba(140, 130, 255, 0.5);
            background: rgba(28, 26, 46, 0.9);
        }

        .back-btn {
            padding: 12px 28px;
            border-radius: 30px;
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 1em;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            font-weight: 500;
            transition: all 0.4s var(--transition-smooth);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(120, 100, 255, 0.2), 0 6px 20px rgba(0, 0, 0, 0.5);
            border-color: rgba(140, 130, 255, 0.4);
        }

        .section {
            display: none;
            padding: 30px 20px;
            width: 100%;
            max-width: 1400px;
            position: relative;
            z-index: 1;
            animation: fadeSlideIn 0.5s var(--transition-smooth);
        }

        .section.active {
            display: block !important;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #search-bar {
            width: 100%;
            max-width: 480px;
            padding: 15px 25px;
            margin: 15px auto 20px;
            border-radius: 30px;
            border: 1.5px solid var(--glass-border);
            font-size: 1em;
            background: var(--glass-bg);
            color: var(--text-primary);
            display: block;
            transition: all 0.4s var(--transition-smooth);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            outline: none;
            z-index: 1;
            position: relative;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.3px;
        }

        #search-bar::placeholder {
            color: rgba(200, 200, 220, 0.5);
        }

        #search-bar:focus {
            border-color: rgba(140, 130, 255, 0.6);
            box-shadow: 0 0 35px rgba(120, 100, 255, 0.25), 0 8px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            z-index: 1;
            position: relative;
        }

        .game-card,
        .apps-card {
            width: 175px;
            background: var(--card-bg);
            padding: 18px 14px 14px;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.4s var(--transition-smooth);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .game-card::before,
        .apps-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(140, 130, 255, 0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .game-card:hover,
        .apps-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 20px 50px rgba(120, 100, 255, 0.2), 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: rgba(140, 130, 255, 0.35);
        }

        .game-card:hover::before,
        .apps-card:hover::before {
            opacity: 1;
        }

        .game-card img,
        .apps-card img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            margin-bottom: 14px;
            border-radius: var(--radius-md);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s var(--transition-smooth);
        }

        .game-card:hover img,
        .apps-card:hover img {
            transform: scale(1.08);
        }

        .game-card span,
        .apps-card span {
            font-weight: 600;
            font-size: 0.95em;
            color: var(--text-primary);
            letter-spacing: 0.2px;
            line-height: 1.3;
        }

        #game-window {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: var(--glass-bg);
            border-radius: var(--radius-lg);
            margin: 20px auto;
            width: 95%;
            max-width: 1100px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-lg);
            z-index: 2;
            position: relative;
            animation: fadeSlideIn 0.4s var(--transition-smooth);
        }

        #game-window iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: var(--radius-md);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        #game-controls {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            margin-top: 18px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #game-controls button {
            padding: 11px 22px;
            border-radius: 30px;
            background: rgba(30, 28, 48, 0.8);
            color: var(--text-primary);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-weight: 500;
            font-size: 0.9em;
            transition: all 0.35s var(--transition-smooth);
        }

        #game-controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(120, 100, 255, 0.2);
            border-color: rgba(140, 130, 255, 0.4);
            background: rgba(36, 34, 56, 0.9);
        }

        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--glass-bg);
            color: var(--text-primary);
            border-radius: var(--radius-lg);
            padding: 30px;
            z-index: 2000;
            min-width: 360px;
            max-width: 90vw;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s var(--transition-smooth);
        }

        #theme-modal.show {
            display: block;
            transform: translate(-50%, -50%) scale(1);
        }

        .theme-option {
            padding: 14px 18px;
            margin: 8px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            background: rgba(26, 24, 42, 0.7);
            text-align: center;
            transition: all 0.35s var(--transition-smooth);
            border: 1px solid transparent;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .theme-option:hover {
            transform: translateX(5px);
            border-color: rgba(140, 130, 255, 0.4);
            box-shadow: 0 8px 25px rgba(120, 100, 255, 0.15);
            background: rgba(32, 30, 52, 0.85);
        }

        #discord-btn {
            margin-top: 50px;
            padding: 14px 30px;
            border-radius: 30px;
            background: linear-gradient(135deg, #5865F2, #7c6ff7);
            color: #fff;
            font-size: 1.05em;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 35px rgba(88, 101, 242, 0.35);
            border: none;
            transition: all 0.4s var(--transition-smooth);
            z-index: 1;
            position: relative;
        }

        #discord-btn:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 18px 45px rgba(120, 100, 255, 0.5), 0 6px 20px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #6b78f5, #8b7ff9);
        }

        #players-online {
            font-size: 1em;
            color: var(--text-secondary);
            background: rgba(22, 22, 37, 0.6);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 6px;
            letter-spacing: 0.4px;
            transition: all 0.3s;
        }

        #online-count {
            font-weight: 700;
            color: #a78bfa;
            transition: all 0.3s;
        }

        #items-loaded {
            text-align: center;
            margin-top: -6px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        .spotify-embed-wrapper {
            margin-top: 50px;
            z-index: 1;
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            max-width: 500px;
            width: 90%;
        }

        .spotify-embed-wrapper iframe {
            display: block;
            width: 100%;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(120, 100, 255, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(120, 100, 255, 0.5);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 40px;
            }

            h2 {
                font-size: 24px;
            }

            .game-card,
            .apps-card {
                width: 140px;
                padding: 14px 10px 10px;
            }

            .game-card img,
            .apps-card img {
                width: 55px;
                height: 55px;
            }

            .welcome-buttons button {
                padding: 13px 24px;
                font-size: 0.95em;
            }

            #game-window iframe {
                height: 350px;
            }

            #settings-btn {
                padding: 10px 16px;
                font-size: 0.85em;
                top: 12px;
                right: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Glow Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <!-- Particle Canvas -->
    <canvas id="particles-canvas"></canvas>

    <div id="welcome-screen">
        <p class="welcome-subtitle">✦ unblocked gaming ✦</p>
        <h1>quantum.</h1>
        <div id="players-online">🟢 Players Online: <span id="online-count">0</span></div>
        <div class="welcome-buttons">
            <button onclick="showSection('games')">🎮 Games</button>
            <button onclick="showSection('apps')">📱 Apps</button>
            <button onclick="showSection('flash')">⚡ Flash Games</button>
            <button onclick="showSection('unblockers')">🔓 Unblockers</button>
        </div>
        <!-- Replaced Discord button with about:blank opener -->
        <button id="discord-btn">🌐 Open in about:blank</button>
    </div>

    <button id="settings-btn" onclick="toggleThemeModal()">⚙️ Settings</button>

    <input type="text" id="search-bar" placeholder="🔍 Search games & apps..." oninput="filterItems()">
    <div id="items-loaded"></div>

    <div id="games" class="section">
        <button class="back-btn" onclick="backToMain(this)">← Back to Home</button>
        <h2>🎮 Games</h2>
        <div class="button-container" id="games-container"></div>
    </div>

    <div id="apps" class="section">
        <button class="back-btn" onclick="backToMain(this)">← Back to Home</button>
        <h2>📱 Unblocked Apps</h2>
        <div class="button-container" id="apps-container"></div>
    </div>

    <div id="flash" class="section">
        <button class="back-btn" onclick="backToMain(this)">← Back to Home</button>
        <h2>⚡ Flash Games</h2>
        <div class="button-container" id="flash-container"></div>
    </div>

    <div id="unblockers" class="section">
        <button class="back-btn" onclick="backToMain(this)">← Back to Home</button>
        <h2>🔓 Unblockers</h2>
        <div class="button-container" id="unblockers-container"></div>
    </div>

    <div id="game-window">
        <h2 id="game-title"></h2>
        <iframe id="game-frame" src="" allow="autoplay; fullscreen; clipboard-write"></iframe>
        <div id="game-controls">
            <button onclick="likeGame()">👍 Like</button>
            <button onclick="dislikeGame()">👎 Dislike</button>
            <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
            <button onclick="savePage()">💾 Save Page</button>
            <button onclick="closeGame()">❌ Close</button>
        </div>
    </div>

    <div id="theme-modal">
        <h2>🎨 Select Theme</h2>
        <div class="theme-option" onclick="applyTheme('dark')">🌑 Dark (Default)</div>
        <div class="theme-option" onclick="applyTheme('purple')">💜 Purple Haze</div>
        <div class="theme-option" onclick="applyTheme('blue')">🌊 Blue Ocean</div>
        <div class="theme-option" onclick="applyTheme('green')">🌿 Forest Green</div>
        <div class="theme-option" onclick="applyTheme('red')">❤️ Crimson Red</div>
        <div class="theme-option" onclick="applyTheme('orange')">🍊 Sunset Orange</div>
        <div class="theme-option" onclick="applyTheme('pink')">🌸 Rose Pink</div>
        <div class="theme-option" onclick="applyTheme('glass')">🥛 Liquid Glass</div>
        <div class="theme-option" onclick="toggleThemeModal()" style="background:rgba(255,255,255,0.05);">✕ Close</div>
    </div>

    <script>
        // ──────────────────────────────────────
        // Particle Background Animation
        // ──────────────────────────────────────
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: -1000, y: -1000 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        document.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.size = Math.random() * 2.5 + 0.8;
                this.speedY = Math.random() * 0.8 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.hue = 240 + Math.random() * 40; // purplish-blue range
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                // Gentle attraction toward mouse
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 180) {
                    const force = (180 - dist) / 180;
                    this.x += dx * force * 0.008;
                    this.y += dy * force * 0.008;
                }
                if (this.y > canvas.height + 10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset();
                    this.y = -10;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 60%, 75%, ${this.opacity})`;
                ctx.fill();
                // subtle glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, ${this.opacity * 0.15})`;
                ctx.fill();
            }
        }
        const particleCount = 80;
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            // Draw connections
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(160,150,220,${0.06 * (1 - dist / 100)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        function generatePlaceholderIcon(name) {
            const canvasEl = document.createElement('canvas');
            canvasEl.width = 80;
            canvasEl.height = 80;
            const ctx2d = canvasEl.getContext('2d');
            // Gradient background
            const grad = ctx2d.createLinearGradient(0, 0, 80, 80);
            grad.addColorStop(0, '#3d3577');
            grad.addColorStop(1, '#1a1540');
            ctx2d.fillStyle = grad;
            ctx2d.fillRect(0, 0, 80, 80);
            // Rounded rect clip
            ctx2d.beginPath();
            ctx2d.roundRect(0, 0, 80, 80, 12);
            ctx2d.clip();
            ctx2d.fillStyle = grad;
            ctx2d.fillRect(0, 0, 80, 80);
            ctx2d.fillStyle = '#e8e0ff';
            ctx2d.font = 'bold 36px "Inter","Space Grotesk",sans-serif';
            ctx2d.textAlign = 'center';
            ctx2d.textBaseline = 'middle';
            ctx2d.fillText(name[0].toUpperCase(), 40, 40);
            // subtle border
            ctx2d.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx2d.lineWidth = 2;
            ctx2d.beginPath();
            ctx2d.roundRect(1, 1, 78, 78, 11);
            ctx2d.stroke();
            return canvasEl.toDataURL();
        }
