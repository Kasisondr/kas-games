/* Google Fonts */

/* Theme variables */
:root {
    --text-color: #fff;
    --bg-1: #5a189a;    /* purple base */
    --bg-2: #10002b; 
    --bg-3: #E3170A;   /* dark purple background */
    --color-1: #E0AAFF; /* light purple accent */
    --color-2: #7B2CBF; /* medium purple accent */
    --color-3: #3C096C; /* dark purple accent */
    --color-4: #240046; /* nearly black purple */
}

/* Base body styles */
body {
    margin: 0;
    font-family: 'Mulish', sans-serif;
    background-color: var(--bg-2);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    transition: background 0.5s, color 0.5s;
    user-select: none;
}

/* Headings */
h1 { font-size: 48px; margin: 10px; }
h2 { font-size: 32px; margin: 8px; }
h3 { font-size: 24px; margin: 4px; }

/* Links */
a { color: var(--text-color); text-decoration: none; }

/* Buttons */
button {
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Mulish', sans-serif;
}

/* Settings button */
#settings-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 10px;
    background: var(--color-3);
    border: none;
    border-radius: 5px;
    color: var(--text-color);
    z-index: 1000;
}

/* Welcome screen */
#welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
}

/* Welcome buttons */
.welcome-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 20px;
}

.welcome-buttons button {
    padding: 15px 25px;
    border-radius: 10px;
    background: var(--color-4);
    color: var(--text-color);
    font-size: 1.2em;
    transition: background 0.3s, transform 0.2s;
}

.welcome-buttons button:hover {
    background: var(--color-2);
    transform: scale(1.05);
}
.back-btn {
    padding: 15px 25px;
    border-radius: 10px;
    background: var(--color-4);
    color: var(--text-color);
    font-size: 1.2em;
    border: none;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    margin-bottom: 20px;
}

.back-btn:hover {
    background: var(--color-2);
    transform: scale(1.05);
}

.section {
    display: none;
    padding: 20px;
}

.section.active {
    display: block !important;
}

.back-btn {
    background: var(--color-3) !important;
    color: var(--text-color) !important;
    border: none !important;
}


/* Search bar */
#search-bar {
    width: 100%;
    max-width: 500px;
    padding: 12px 18px;
    margin: 20px auto;
    border-radius: 12px;
    border: none;
    font-size: 1em;
    background: color-mix(in srgb, var(--color-4) 50%, var(--bg-2) 50%);
    color: var(--text-color);
    display: block;
    transition: background 0.3s, color 0.3s;
}

/* Container for cards */
.button-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

/* Cards */
.game-card, .apps-card {
    width: 150px;
    background: color-mix(in srgb, var(--color-3) 30%, var(--color-4) 70%);
    padding: 10px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: background 0.3s, transform 0.2s;
}

.game-card:hover, .apps-card:hover {
    background: var(--color-2);
    transform: scale(1.05);
}

/* Card images */
.game-card img, .apps-card img {

}

/* Card buttons */
.game-card button, .apps-card button {

    border-radius: 5px;
    background: var(--color-4);
    color: var(--text-color);

    transition: background 0.3s, transform 0.2s;
}

.game-card button:hover, .apps-card button:hover {
    background: var(--color-2);
    transform: scale(1.05);
}

/* Game window */
#game-window {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    background: color-mix(in srgb, var(--color-3) 40%, var(--bg-2) 60%);

    margin: 20px;

#game-window iframe {

<script>
// Track current section
let lastSection = null;
function showSection(sectionId) {
    // Hide welcome screen
    document.getElementById('welcome-screen').style.display = 'none';
    
    // Show search bar only for sections
    document.getElementById('search-bar').style.display = 'block';
    
    // Hide all sections
    document.querySelectorAll('.section').forEach(sec => {
        sec.classList.remove('active');
        sec.style.display = "none";
    });

    // Show selected section
    const section = document.getElementById(sectionId);
    section.classList.add('active');
    section.style.display = "block";

    // Close any open game
    closeGame();

    // Track which section is open
    lastSection = sectionId;

    // Count items and display text
    updateItemsLoaded(sectionId);
}


// Return to main welcome screen
function backToMain() {
    // Hide all sections
    document.querySelectorAll('.section').forEach(sec => {
        sec.classList.remove('active');
        sec.style.display = 'none';
    });

    // Close game window
    closeGame();

    // Show welcome screen
    document.getElementById('welcome-screen').style.display = 'flex';

    lastSection = null;
}

// Open a game or app
function openItem(item) {
    if(!lastSection) return; // safety check

    // Hide only the container of the current section
    const container = document.getElementById(lastSection + '-container');
    container.style.display = 'none';

    // Show game window
    document.getElementById('game-title').innerText = item.name;
    document.getElementById('game-frame').src = item.url;
    document.getElementById('game-window').style.display = 'flex';
}

// Close game window
// optional param 'keepSection' = true if we only want to close game without hiding section
function closeGame(keepSection = false) {
    const gameWindow = document.getElementById('game-window');
    gameWindow.style.display = 'none';
    document.getElementById('game-frame').src = '';

    // Restore section container if a section is active
    if(lastSection && keepSection !== true) {
        document.getElementById(lastSection + '-container').style.display = 'flex';
    }
}


document.getElementById('discord-btn').onclick = function() {
    window.open('https://discord.gg/X6m7TtSXrM', '_blank');
};

function toggleFullscreen(){
    const el = document.getElementById('game-frame');
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
function likeGame(){ alert('Liked!'); }
function dislikeGame(){ alert('Disliked!'); }

// Search
function filterItems(){
    const query = document.getElementById('search-bar').value.toLowerCase();
    const container = lastSection ? document.getElementById(lastSection + '-container') : null;
    if(!container) return;
    container.querySelectorAll('.game-card, .apps-card').forEach(card=>{
        card.style.display = card.querySelector('button').innerText.toLowerCase().includes(query) ? 'flex' : 'none';
    });
}

// Theme modal
function toggleThemeModal(){
    const modal = document.getElementById('theme-modal');
    modal.style.display = modal.style.display==='block'?'none':'block';
}

// Theme apply
function applyTheme(color){
    const root = document.documentElement;
    if(color==='purple'){
        root.style.setProperty('--bg-1','#5a189a');
        root.style.setProperty('--bg-2','#10002b');
        root.style.setProperty('--color-1','#E0AAFF');
        root.style.setProperty('--color-2','#7B2CBF');
        root.style.setProperty('--color-3','#3C096C');
        root.style.setProperty('--color-4','#240046');
    } else if(color==='blue'){
        root.style.setProperty('--bg-1','#0d6efd');
        root.style.setProperty('--bg-2','#03045e');
        root.style.setProperty('--color-1','#90e0ef');
        root.style.setProperty('--color-2','#00b4d8');
        root.style.setProperty('--color-3','#0077b6');
        root.style.setProperty('--color-4','#023e8a');
    } else if(color==='green'){
        root.style.setProperty('--bg-1','#38b000');
        root.style.setProperty('--bg-2','#004d00');
        root.style.setProperty('--color-1','#b7e4c7');
        root.style.setProperty('--color-2','#70e000');
        root.style.setProperty('--color-3','#2a9d8f');
        root.style.setProperty('--color-4','#145214');
        } else if(color==='red'){
        root.style.setProperty('--bg-1','#38b000');
        root.style.setProperty('--bg-2','#004d00');
        root.style.setProperty('--color-1','#b7e4c7');
        root.style.setProperty('--color-2','#70e000');
        root.style.setProperty('--color-3','#2a9d8f');
        root.style.setProperty('--color-4','#145214');
    }
    toggleThemeModal();
}

// Players online
function updatePlayersOnline(){
    const count=Math.floor(Math.random()*500)+50;
    document.getElementById('online-count').innerText = count;
}
setInterval(updatePlayersOnline,5000);
updatePlayersOnline();

// Render placeholder cards
function generatePlaceholderIcon(name){
    const canvas=document.createElement('canvas'); canvas.width=80; canvas.height=80;
    const ctx=canvas.getContext('2d'); ctx.fillStyle='black'; ctx.fillRect(0,0,80,80);
    ctx.fillStyle='white'; ctx.font='bold 40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(name[0].toUpperCase(),40,40); return canvas.toDataURL();
}
function renderItems(containerId, items){
    const container=document.getElementById(containerId);
    container.innerHTML='';
    items.forEach(item=>{
        const card=document.createElement('div'); 
        card.className=containerId.includes('apps') ? 'apps-card' : 'game-card';
        const img=document.createElement('img'); img.src=generatePlaceholderIcon(item.name);
        const btn=document.createElement('button'); btn.innerText=item.name;
        btn.onclick=()=>openItem(item);
        card.appendChild(img); card.appendChild(btn); container.appendChild(card);
    });
}

function renderNews(containerId, items){
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'news-card';
        const title = document.createElement('h3'); title.innerText = item.title;
        const desc = document.createElement('p'); desc.innerText = item.description;
        const btn = document.createElement('button'); btn.innerText = 'Read More';
        btn.onclick = () => window.open(item.url, '_blank');
        card.appendChild(title);
        card.appendChild(desc);
        card.appendChild(btn);
        container.appendChild(card);
    });
}
