<!doctype html>
<html lang="en" data-theme="midnight" data-mode="dark" data-density="comfortable" data-bg="solid">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Lume</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.google.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5 21.5 12 12 21.5 2.5 12Z' fill='none' stroke='%237c9cff' stroke-width='1.6' stroke-linejoin='round' opacity='.45'/%3E%3Cpath d='M12 7 17 12 12 17 7 12Z' fill='%237c9cff'/%3E%3C/svg%3E" />

<style>
/* ==========================================================================
   1. TOKENS
   ========================================================================== */
:root{
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  --r-xs: 4px; --r-sm: 7px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --t-fast: 120ms; --t: 190ms; --t-slow: 320ms;
  --accent-fg: #0a0b0d;
  --page: 28px; --row-pad: 13px; --gap: 14px;
}
:root, html[data-mode="dark"]{
  --bg: #0a0b0d; --bg-elev: #101114; --surface: #14161a; --surface-2: #1a1d22;
  --surface-hover: #20242a; --border: #24272d; --border-strong: #33373f;
  --fg: #eceef1; --fg-muted: #9aa1ab; --fg-subtle: #6a717b;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 14px 40px -18px rgba(0,0,0,.75);
  --shadow-lg: 0 30px 80px -30px rgba(0,0,0,.85);
  --scrim: rgba(6,7,9,.72);
  color-scheme: dark;
}
html[data-mode="light"]{
  --bg: #f6f7f9; --bg-elev: #ffffff; --surface: #ffffff; --surface-2: #f1f2f5;
  --surface-hover: #eaecf0; --border: #e1e4e9; --border-strong: #cbd0d8;
  --fg: #14161a; --fg-muted: #5b626c; --fg-subtle: #868d97;
  --shadow-sm: 0 1px 2px rgba(16,20,28,.06);
  --shadow-md: 0 14px 34px -20px rgba(16,20,28,.35);
  --shadow-lg: 0 30px 70px -34px rgba(16,20,28,.4);
  --scrim: rgba(20,22,26,.42);
  --accent-fg: #0a0b0d;
  color-scheme: light;
}
html[data-theme="midnight"]{ --accent: #7c9cff; }
html[data-theme="aurora"]  { --accent: #46c99b; }
html[data-theme="ember"]   { --accent: #e8843f; }
html[data-theme="ocean"]   { --accent: #48a9d6; }
html[data-theme="forest"]  { --accent: #74ab6a; }
html[data-theme="rose"]    { --accent: #dd7099; }
html[data-theme="mono"]    { --accent: #9aa1ab; }
:root{
  --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 42%, transparent);
  --accent-hover: color-mix(in srgb, var(--accent) 86%, #ffffff 14%);
  --danger: #e5604f; --danger-soft: color-mix(in srgb, var(--danger) 16%, transparent);
  --ok: #46c99b;
}
html[data-density="compact"]    { --page: 20px; --row-pad: 10px; --gap: 11px; }
html[data-density="comfortable"]{ --page: 28px; --row-pad: 13px; --gap: 14px; }
html[data-density="spacious"]   { --page: 40px; --row-pad: 17px; --gap: 18px; }

/* ==========================================================================
   2. BASE
   ========================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--fg);
  font-family:var(--font); font-size:15px; line-height:1.55;
  letter-spacing:-0.005em; -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition: background var(--t-slow) var(--ease), color var(--t-slow) var(--ease);
  overflow-x:hidden;
}
body::before{ content:''; position:fixed; inset:0; pointer-events:none; z-index:0; }
html[data-bg="grid"] body::before{
  background-image:
    linear-gradient(to right, var(--border) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border) 1px, transparent 1px);
  background-size: 38px 38px; opacity:.4;
  mask-image: radial-gradient(120% 90% at 50% 0%, #000 0%, transparent 78%);
  -webkit-mask-image: radial-gradient(120% 90% at 50% 0%, #000 0%, transparent 78%);
}
html[data-bg="vignette"] body::before{
  background: radial-gradient(130% 90% at 50% -10%, transparent 42%, rgba(0,0,0,.42) 100%);
}
html[data-mode="light"][data-bg="vignette"] body::before{
  background: radial-gradient(130% 90% at 50% -10%, transparent 46%, rgba(20,22,26,.10) 100%);
}
h1,h2,h3,h4,p{ margin:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:none; padding:0; cursor:pointer; }
a{ color:inherit; text-decoration:none; }
:focus{ outline:none; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-sm); }
::selection{ background: var(--accent-soft); }
*{ scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{
  background:var(--border-strong); border-radius:99px;
  border:3px solid transparent; background-clip:content-box;
}
*::-webkit-scrollbar-thumb:hover{ background:var(--fg-subtle); background-clip:content-box; }
.ic{ display:inline-flex; align-items:center; justify-content:center; flex:none; line-height:0; }
.ic svg{ width:18px; height:18px; stroke-width:1.75; }
.ic-sm svg{ width:15px; height:15px; }
.ic-lg svg{ width:22px; height:22px; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ==========================================================================
   3. PRIMITIVES
   ========================================================================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:38px; padding:0 15px; border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface); color:var(--fg);
  font-size:14px; font-weight:500; letter-spacing:-.01em; white-space:nowrap;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
              color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease),
              box-shadow var(--t-fast) var(--ease);
}
.btn:hover{ background:var(--surface-hover); border-color:var(--border-strong); }
.btn:active{ transform:translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"]{ opacity:.45; pointer-events:none; }
.btn-primary{
  background:var(--accent); border-color:var(--accent); color:var(--accent-fg);
  font-weight:600; box-shadow:0 1px 0 rgba(255,255,255,.12) inset;
}
.btn-primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
.btn-ghost{ background:transparent; border-color:transparent; color:var(--fg-muted); }
.btn-ghost:hover{ background:var(--surface-2); color:var(--fg); border-color:transparent; }
.btn-danger{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 34%, transparent); background:transparent; }
.btn-danger:hover{ background:var(--danger-soft); border-color:var(--danger); }
.btn-sm{ height:32px; padding:0 11px; font-size:13px; }
.btn-icon{ width:38px; padding:0; }
.btn-icon.btn-sm{ width:32px; }
.input{
  width:100%; height:42px; padding:0 13px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);
  color:var(--fg); font-size:14.5px;
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease),
              background var(--t-fast) var(--ease);
}
.input::placeholder{ color:var(--fg-subtle); }
.input:hover{ border-color:var(--border-strong); }
.input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"]{ border-color:var(--danger); }
.input[aria-invalid="true"]:focus{ box-shadow:0 0 0 3px var(--danger-soft); }
.label{
  display:block; font-size:12.5px; font-weight:600; letter-spacing:.02em;
  text-transform:uppercase; color:var(--fg-subtle); margin-bottom:8px;
}
.hint{ font-size:12.5px; color:var(--fg-subtle); line-height:1.5; }
.err{ font-size:12.5px; color:var(--danger); margin-top:6px; display:flex; gap:6px; align-items:center; }
.seg{ display:inline-flex; padding:3px; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm); }
.seg-btn{
  height:30px; padding:0 14px; border-radius:5px;
  font-size:13.5px; font-weight:500; color:var(--fg-muted);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.seg-btn:hover{ color:var(--fg); }
.seg-btn[aria-checked="true"]{
  background:var(--surface); color:var(--fg);
  box-shadow:var(--shadow-sm); border:1px solid var(--border); margin:-1px;
}
.switch{
  position:relative; width:40px; height:23px; flex:none; border-radius:99px;
  background:var(--surface-2); border:1px solid var(--border);
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease);
}
.switch:hover{ border-color:var(--border-strong); }
.switch[aria-checked="true"]{ background:var(--accent); border-color:var(--accent); }
.switch-knob{
  position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%;
  background:var(--fg-subtle);
  transition: transform var(--t) var(--ease), background var(--t) var(--ease);
}
.switch[aria-checked="true"] .switch-knob{ transform:translateX(17px); background:var(--accent-fg); }
.keycap{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:74px; height:34px; padding:0 12px; border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface-2); color:var(--fg);
  font-family:var(--mono); font-size:12.5px;
  transition: all var(--t-fast) var(--ease);
}
.keycap:hover{ border-color:var(--border-strong); }
.keycap.is-capturing{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); color:var(--accent); }
.keycap[data-empty="true"]{ color:var(--fg-subtle); font-style:italic; font-family:var(--font); }

/* ==========================================================================
   4. SPLASH
   ========================================================================== */
#splash{
  position:fixed; inset:0; z-index:200; display:grid; place-items:center;
  background:var(--bg); transition: opacity 420ms var(--ease), visibility 420ms;
}
#splash.is-gone{ opacity:0; visibility:hidden; }
.splash-inner{ display:flex; flex-direction:column; align-items:center; gap:16px; }
.splash-mark{ color:var(--accent); animation: markIn 700ms var(--ease-out) both; }
.splash-word{
  font-size:19px; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
  color:var(--fg); animation: fadeUp 620ms 90ms var(--ease-out) both;
}
.splash-bar{
  width:132px; height:2px; border-radius:99px; background:var(--border);
  overflow:hidden; animation: fadeUp 620ms 150ms var(--ease-out) both;
}.accent-name{ color: var(--accent); }
.splash-bar span{
  display:block; height:100%; width:36%; background:var(--accent);
  border-radius:99px; animation: slide 1100ms var(--ease) infinite;
}
@keyframes slide{ 0%{ transform:translateX(-110%);} 100%{ transform:translateX(390%);} }
@keyframes markIn{ from{ opacity:0; transform:scale(.82) rotate(-12deg);} to{ opacity:1; transform:none;} }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(7px);} to{ opacity:1; transform:none;} }

/* ==========================================================================
   5. APP SHELL
   ========================================================================== */
#app{ position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:20px;
  height:60px; padding:0 var(--page);
  border-bottom:1px solid var(--border);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
}
.brand{
  display:flex; align-items:center; gap:9px;
  font-weight:600; font-size:16px; letter-spacing:-.02em;
  color:var(--fg); flex:none;
}
.brand-mark{ color:var(--accent); display:flex; transition: transform 500ms var(--ease-out); }
.brand:hover .brand-mark{ transform:rotate(90deg); }
.nav{ display:flex; align-items:center; gap:2px; margin-left:6px; }
.nav-item{
  position:relative; display:flex; align-items:center; gap:7px;
  height:34px; padding:0 12px; border-radius:var(--r-sm);
  font-size:13.5px; font-weight:500; color:var(--fg-muted);
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.nav-item:hover{ color:var(--fg); background:var(--surface-2); }
.nav-item.is-active{ color:var(--fg); background:var(--surface-2); }
.nav-item.is-active::after{
  content:''; position:absolute; left:12px; right:12px; bottom:-1px;
  height:2px; border-radius:2px; background:var(--accent);
}
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.clock-chip{
  display:flex; align-items:center; gap:7px;
  height:32px; padding:0 11px; border-radius:99px;
  border:1px solid var(--border); background:var(--surface);
  font-family:var(--mono); font-size:12.5px; color:var(--fg-muted);
  font-variant-numeric: tabular-nums;
}
.avatar-btn{
  display:block; width:34px; height:34px; border-radius:50%;
  overflow:hidden; border:1px solid var(--border);
  transition: border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
  flex:none;
}
.avatar-btn:hover{ border-color:var(--accent); transform:translateY(-1px); }
.page{
  flex:1; width:100%; max-width:1180px; margin:0 auto;
  padding: var(--page) var(--page) 80px;
  animation: pageIn 380ms var(--ease-out) both;
}
@keyframes pageIn{ from{ opacity:0; transform:translateY(9px);} to{ opacity:1; transform:none;} }
.page-head{ margin-bottom:26px; }
.page-title{ font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.2; }
.page-sub{ margin-top:5px; color:var(--fg-muted); font-size:14px; }
.tabbar{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:50;
  border-top:1px solid var(--border);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tabbar-inner{ display:flex; justify-content:space-around; }
.tab-item{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  flex:1; padding:7px 4px; border-radius:var(--r-sm);
  font-size:10.5px; font-weight:500; color:var(--fg-subtle);
  transition: color var(--t-fast) var(--ease);
}
.tab-item.is-active{ color:var(--accent); }

/* ==========================================================================
   6. ONBOARDING
   ========================================================================== */
.onboard{
  position:fixed; inset:0; z-index:120;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px; background:var(--bg);
  transition: opacity 480ms var(--ease), transform 480ms var(--ease);
}
.onboard.is-leaving{ opacity:0; transform:scale(1.015); pointer-events:none; }
.onboard-inner{ width:100%; max-width:452px; }
.ob-step{ animation: obIn 460ms var(--ease-out) both; }
@keyframes obIn{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
.ob-greet{
  font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); margin-bottom:14px;
}
.ob-q{ font-size:30px; font-weight:600; letter-spacing:-.035em; line-height:1.18; margin-bottom:24px; }
.ob-q .ob-name{ color:var(--accent); }
.ob-form{ display:flex; gap:9px; }
.ob-form .input{ flex:1; height:46px; font-size:16px; }
.ob-form .btn{ height:46px; padding:0 20px; }
.ob-actions{ display:flex; align-items:center; gap:10px; margin-top:20px; flex-wrap:wrap; }
.ob-skip{
  color:var(--fg-subtle); font-size:13.5px; padding:8px 2px; border-radius:var(--r-sm);
  transition: color var(--t-fast) var(--ease);
  text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--border-strong);
}
.ob-skip:hover{ color:var(--fg); }
.ob-avatar-row{ display:flex; align-items:center; gap:20px; margin-bottom:26px; }
.ob-avatar{
  width:92px; height:92px; border-radius:50%; overflow:hidden; flex:none;
  border:1px solid var(--border); background:var(--surface-2);
}
.ob-dots{ display:flex; gap:7px; margin-top:44px; justify-content:center; }
.ob-dot{
  width:6px; height:6px; border-radius:99px; background:var(--border-strong);
  transition: all var(--t) var(--ease);
}
.ob-dot.is-active{ width:22px; background:var(--accent); }
.tz-wrap{ position:relative; }
.tz-list{
  position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:20;
  max-height:238px; overflow-y:auto;
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--r-md);
  box-shadow:var(--shadow-md); padding:5px;
}
.tz-opt{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:100%; padding:8px 10px; border-radius:var(--r-sm);
  font-size:13.5px; text-align:left; color:var(--fg);
  transition: background var(--t-fast) var(--ease);
}
.tz-opt:hover{ background:var(--surface-2); }
.tz-opt small{ color:var(--fg-subtle); font-family:var(--mono); font-size:11px; }
.tz-empty{ padding:14px 10px; font-size:13px; color:var(--fg-subtle); text-align:center; }
.clock-choice{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.clock-opt{
  padding:20px 18px; border-radius:var(--r-lg);
  border:1px solid var(--border); background:var(--surface); text-align:left;
  transition: all var(--t) var(--ease);
}
.clock-opt:hover{ border-color:var(--border-strong); transform:translateY(-2px); }
.clock-opt[aria-checked="true"]{
  border-color:var(--accent); background:var(--accent-soft);
  box-shadow:0 0 0 1px var(--accent) inset;
}
.clock-opt-preview{
  font-family:var(--mono); font-size:24px; font-weight:500;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-bottom:6px;
}
.clock-opt-label{ font-size:12.5px; color:var(--fg-muted); font-weight:500; }

/* ==========================================================================
   7. HOME — centered hero + dock
   ========================================================================== */
.home-shell{
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height: calc(100vh - 160px);
  padding: 40px var(--page) 60px;
  text-align:center;
}
.home-greeting{
  font-size: clamp(26px, 4.2vw, 38px);
  font-weight: 600; letter-spacing: -.035em;
  line-height: 1.15; margin: 0 0 8px;
}
.home-time{
  font-size: 15px; color: var(--fg-muted);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.005em; margin: 0 0 44px;
}
.home-time strong{ color: var(--fg); font-weight: 500; font-family: var(--mono); }
.dock{
  display: flex; gap: 10px; padding: 8px;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border: 1px solid var(--border);
  border-radius: 18px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  margin-bottom: 36px;
}
.dock-btn{
  position: relative;
  width: 54px; height: 54px;
  border-radius: 12px;
  display: grid; place-items: center;
  background: transparent; color: var(--fg-muted);
  transition: background var(--t) var(--ease),
              color var(--t) var(--ease),
              transform var(--t) var(--ease);
}
.dock-btn:hover{ background: var(--surface-2); color: var(--accent); transform: translateY(-3px); }
.dock-btn:active{ transform: translateY(-1px); }
.dock-btn .ic svg{ width: 22px; height: 22px; stroke-width: 1.6; }
.dock-tooltip{
  position: absolute; bottom: calc(100% + 12px); left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: var(--bg-elev); border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  padding: 5px 10px; border-radius: 7px;
  font-size: 12px; font-weight: 500; color: var(--fg);
  white-space: nowrap; opacity: 0; pointer-events: none;
  transition: opacity var(--t) var(--ease), transform var(--t) var(--ease);
}
.dock-tooltip::after{
  content: ''; position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%);
  border: 4px solid transparent;
  border-top-color: var(--bg-elev);
  filter: drop-shadow(0 1px 0 var(--border));
}
.dock-btn:hover .dock-tooltip,
.dock-btn:focus-visible .dock-tooltip{
  opacity: 1; transform: translateX(-50%) translateY(0);
}

              border-color var(--t) var(--ease),

.game-card:hover{

.gc-art{
  position:relative;

  background: var(--surface-2);

  display:grid; place-items:center;
}
.gc-fallback{
  position:absolute; inset:0;
  display:grid; place-items:center;

  color: rgba(255,255,255,.28);
  letter-spacing:-.04em;

  pointer-events:none;
}

.gc-logo{
  position:relative; z-index:1;
  max-width:58%; max-height:58%;

  object-fit:contain;

  transition: transform 520ms var(--ease-out);
}
.game-card:hover .gc-logo{ transform: scale(1.06); }
.gc-play{
  position:absolute; right:9px; bottom:9px;
  width:30px; height:30px; border-radius:50%;
  display:grid; place-items:center;

  opacity:0; transform:scale(.85) translateY(4px);
  transition: all var(--t) var(--ease);

}
.game-card:hover .gc-play, .game-card:focus-visible .gc-play{ opacity:1; transform:none; }
.gc-body{ padding:11px 13px 13px; }
.gc-title{
  font-size:13.5px; font-weight:600; letter-spacing:-.015em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.empty-state{
  display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:64px 20px;
  border:1px dashed var(--border-strong);
  border-radius:var(--r-lg);
  color:var(--fg-subtle); text-align:center;
}
.empty-state .ic{ color:var(--fg-subtle); }
.empty-state p{ font-size:14px; }

/* ==========================================================================
   9. MODAL
   ========================================================================== */
.overlay{
  position:fixed; inset:0; z-index:100;
  display:grid; place-items:center; padding:22px;
  background:var(--scrim);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  animation: fadeIn 200ms var(--ease) both;
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.modal{
  width:100%;
  background:var(--bg-elev); border:1px solid var(--border);
  border-radius:var(--r-xl); box-shadow:var(--shadow-lg);
  overflow:hidden;
  animation: modalIn 320ms var(--ease-out) both;
  display:flex; flex-direction:column;
}
@keyframes modalIn{ from{ opacity:0; transform:translateY(14px) scale(.985);} to{ opacity:1; transform:none;} }

.modal-head{
  display:flex; align-items:center; gap:12px;
  padding:14px 16px; border-bottom:1px solid var(--border); flex:none;
}
.modal-title{ font-size:14.5px; font-weight:600; letter-spacing:-.015em; }

.modal-body{ flex:1; min-height:0; position:relative; background:#0a0b0d; }

.modal-foot{
  padding:12px 16px; border-top:1px solid var(--border);

}
.modal-content-pad{ padding:22px; }
.embed-shell{ position:fixed; inset:0; z-index:150; background:#0a0b0d; display:flex; flex-direction:column; }
.embed-bar{

  height:48px; padding:0 14px;

}
.embed-bar-title{ font-size:13px; color:var(--fg-muted); font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.embed-frame-wrap{ flex:1; position:relative; }
.embed-frame-wrap iframe{ width:100%; height:100%; border:0; display:block; background:#fff; }
.frame-fallback{

  padding:32px; text-align:center;

}
.frame-fallback h3{ font-size:16px; font-weight:600; color:var(--fg); }
.frame-fallback p{ font-size:13.5px; max-width:380px; line-height:1.55; }

/* ==========================================================================
   10. APPS
   ========================================================================== */
.construction{

}
.con-art{ position:relative; width:120px; height:120px; margin-bottom:30px; }
.con-ring{ position:absolute; inset:0; border-radius:50%; border:1px solid var(--border); }
.con-ring--2{ inset:16px; border-color:var(--border-strong); }
.con-core{ position:absolute; inset:38px; display:grid; place-items:center; color:var(--accent); }
.con-orbit{ position:absolute; inset:0; animation: spin 6.5s linear infinite; }
.con-orbit span{
  position:absolute; top:-3px; left:50%; margin-left:-3px;
  width:6px; height:6px; border-radius:50%; background:var(--accent);

}
@keyframes spin{ to{ transform:rotate(360deg); } }
.con-bars{ display:flex; gap:5px; margin-top:26px; }
.con-bars i{

}
.con-bars i:nth-child(1){ animation-delay:0ms; }
.con-bars i:nth-child(2){ animation-delay:130ms; }
.con-bars i:nth-child(3){ animation-delay:260ms; }
.con-bars i:nth-child(4){ animation-delay:390ms; }
@keyframes barPulse{

.con-title{ font-size:26px; font-weight:600; letter-spacing:-.03em; }
.con-lead{ margin-top:10px; font-size:15px; color:var(--fg-muted); max-width:400px; line-height:1.6; }

/* ==========================================================================
   11. PROFILE
   ========================================================================== */
.profile-head{

}

}

}

/* ==========================================================================
   12. SETTINGS

.settings-layout{
  display:grid; grid-template-columns:186px minmax(0,1fr);

.setting-control{ flex:none; display:flex; align-items:center; gap:9px; }

}

   13. TOASTS
   ========================================================================== */
#toasts{

  bottom:22px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; gap:9px; align-items:center;
  pointer-events:none; width:min(440px, calc(100vw - 32px));
}
.toast{
  pointer-events:auto;
  display:flex; align-items:flex-start; gap:11px;
  width:100%; padding:12px 14px; border-radius:var(--r-md);
  border:1px solid var(--border); background:var(--bg-elev);
  box-shadow:var(--shadow-md); font-size:13.5px;

.toast .ic{ margin-top:1px; flex:none; }

.toast-body{ flex:1; min-width:0; line-height:1.5; }

@media (max-width: 900px){

    scrollbar-width:none;

  .settings-nav::-webkit-scrollbar{ display:none; }
  .settings-nav-item{ flex:none; }
}

  .tabbar{ display:block; }

  .home-shell{ min-height: calc(100vh - 200px); }
}

  .clock-choice{ grid-template-columns:1fr; }

  .overlay{ padding:10px; }
  .theme-grid{ grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); }
  .home-greeting{ font-size: 24px; }
  .home-time{ margin-bottom: 30px; }
}

  *,*::before,*::after{
    animation-duration:.01ms !important;

  }
  .con-orbit{ animation:none; }
  .splash-bar span{ animation:none; width:100%; }
  .con-bars i{ animation:none; background:var(--accent); transform:none; }
}

        captureState = null;
        return;
      }
      const combo = comboFromEvent(e);
      if (!combo) return;
      if (target === 'quickExit.key') setSettings({ quickExit: { key: combo } });
      else {
        const patch = { shortcuts: {} }; patch.shortcuts[target] = combo;
        setSettings(patch);
      }
      captureState = null;
      return;
    }
    if (e.key === 'Escape') {
      if (openOverlay) { closeOverlay(); return; }
      const shell = $('#overlay-root .embed-shell');
      if (shell) { $('#overlay-root').innerHTML = ''; return; }
    }
    if (isTypingTarget(e.target)) return;
    const s = state.settings;
    if (s.quickExit.enabled && s.quickExit.key && comboMatches(e, s.quickExit.key)) {
      e.preventDefault();
      triggerQuickExit();
      return;
    }
    for (let i = 0; i < SHORTCUT_ACTIONS.length; i++) {
      const action = SHORTCUT_ACTIONS[i];
      const combo = s.shortcuts[action.id];
      if (combo && comboMatches(e, combo)) {
        e.preventDefault();
        if (action.route) navigateTo(action.route);
        else if (action.action === 'cursor') {
          setSettings({ cursor: !s.cursor });
          toast('Custom cursor ' + (!s.cursor ? 'enabled' : 'disabled'), 'info', 2000);
        }
        return;

  let aboutBlankBlocked = false;

  function buildStandaloneHTML() {
    const clone = document.documentElement.cloneNode(true);
    const splash = clone.querySelector('#splash');
    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
    const appEl = clone.querySelector('#app');
    if (appEl) appEl.innerHTML = '';
    const overlayRoot = clone.querySelector('#overlay-root');
    if (overlayRoot) overlayRoot.innerHTML = '';
    const toasts = clone.querySelector('#toasts');
    if (toasts) toasts.innerHTML = '';
    const cursorStyle = clone.querySelector('#lume-cursor-style');
    if (cursorStyle && cursorStyle.parentNode) cursorStyle.parentNode.removeChild(cursorStyle);
    return '<!doctype html>\n' + clone.outerHTML;
  }

  function openInAboutBlank() {
    const win = window.open('about:blank', '_blank');
    if (!win) {
      aboutBlankBlocked = true;
      toast('Your browser blocked the new tab. Allow popups for Lume and try again.', 'error', 6500);
      render();
      return;
    }
    aboutBlankBlocked = false;
    try {
      win.document.open();
      win.document.write(buildStandaloneHTML());
      win.document.close();
      win.focus();
    } catch (e) {
      try { win.location.replace(window.location.href); }
      catch (err) { toast('The new tab opened but Lume could not write to it.', 'error', 5500); }
    }
    // Try to close our tab (browser may block). If blocked, at least
    // replace the URL so Lume's address is not sitting in history.
    window.setTimeout(function () {
      try { window.close(); } catch (e) { /* expected */ }
      if (!window.closed) {
        try { window.location.replace('about:blank'); } catch (e) { /* noop */ }
      }
    }, 120);
    render();
  }

function firstLetterOf(title) {
  // Strip leading punctuation / numbers / symbols
  const cleaned = String(title || '').replace(/^[^A-Za-z]+/, '');
  const ch = cleaned.charAt(0).toUpperCase();
  return /[A-Z]/.test(ch) ? ch : '#';
}

/** Sort alphabetically, ignoring leading symbols/numbers. */
function sortGamesAZ(list) {
  return list.slice().sort(function (a, b) {
    const ka = String(a.title).replace(/^[^A-Za-z0-9]+/, '').toLowerCase();
    const kb = String(b.title).replace(/^[^A-Za-z0-9]+/, '').toLowerCase();
    return ka.localeCompare(kb, 'en', { numeric: true, sensitivity: 'base' });
  });
}

/** Group a sorted list into { A: [...], B: [...], ..., '#': [...] }. */
function groupGamesAZ(list) {
  const groups = {};
  sortGamesAZ(list).forEach(function (g) {
    const letter = firstLetterOf(g.title);
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(g);
  });
  return groups;
}

  let cachedTimezones = null;
  function timezoneList() {
    if (cachedTimezones) return cachedTimezones;
    let zones = [];
    try {
      if (typeof Intl.supportedValuesOf === 'function') zones = Intl.supportedValuesOf('timeZone');
    } catch (e) { /* noop */ }
    if (!zones.length) {
      zones = [
        'Europe/London', 'Europe/Dublin', 'Europe/Paris', 'Europe/Berlin', 'Europe/Madrid',
        'Europe/Rome', 'Europe/Amsterdam', 'Europe/Stockholm', 'Europe/Warsaw', 'Europe/Moscow',
        'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
        'America/Toronto', 'America/Vancouver', 'America/Mexico_City', 'America/Sao_Paulo',
        'America/Bogota', 'America/Argentina/Buenos_Aires',
        'Asia/Tokyo', 'Asia/Shanghai', 'Asia/Hong_Kong', 'Asia/Singapore', 'Asia/Seoul',
        'Asia/Kolkata', 'Asia/Dubai', 'Asia/Bangkok', 'Asia/Jakarta', 'Asia/Manila',
        'Australia/Sydney', 'Australia/Melbourne', 'Australia/Perth', 'Pacific/Auckland',
        'Africa/Johannesburg', 'Africa/Lagos', 'Africa/Cairo', 'Africa/Nairobi', 'UTC'
      ];
    }
    cachedTimezones = zones.slice().sort(function (a, b) {
      if (a === 'Europe/London') return -1;
      if (b === 'Europe/London') return 1;
      return a.localeCompare(b);
    });
    return cachedTimezones;
  }
  function timezoneOptionsHTML(query) {
    const zones = timezoneList();
    const q = String(query || '').trim().toLowerCase();
    const filtered = q
      ? zones.filter(function (z) { return z.toLowerCase().indexOf(q) >= 0; }).slice(0, 60)
      : zones.slice(0, 60);
    if (!filtered.length) return '<div class="tz-empty">No time zones match that search.</div>';
    return filtered.map(function (z) {
      return '<button class="tz-opt" type="button" role="option" data-action="ob-set-tz" data-value="' + esc(z) + '">' +
        '<span>' + esc(z.split('/').slice(-1)[0].replace(/_/g, ' ')) + '</span>' +
        '<small>' + esc(z) + '</small></button>';
    }).join('');
  }
  function finishOnboarding() {
    const root = $('#onboardRoot');

  let lastFocusedId = null;
  function captureFocus() {
    const el = document.activeElement;
    lastFocusedId = (el && el.dataset && el.dataset.focusId) ? el.dataset.focusId : null;
  }
  function restoreFocus() {
    if (!lastFocusedId) return;
    const el = document.querySelector('[data-focus-id="' + lastFocusedId + '"]');
    if (el && typeof el.focus === 'function') {
      try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    }
    lastFocusedId = null;
  }

  let lastClockText = '';
  function updateClocks() {
    const s = state.settings;
    if (!s.onboarded) return;
    const now = new Date();
    const tz = activeTimezone();
    const timeText = formatTime(now, tz, s.clock);
    const greetingText = greetingFor(hourInZone(now, tz)) + (s.name ? ', ' + s.name : '');
    $$('[data-clock="time"]').forEach(function (el) {
      if (el.textContent !== timeText) el.textContent = timeText;
    });
    $$('[data-clock="greeting"]').forEach(function (el) {
      if (el.textContent !== greetingText) el.textContent = greetingText;
    });
    lastClockText = timeText;
  }
  window.setInterval(function () {
    if (!state.settings.onboarded) return;
    const next = formatTime(new Date(), activeTimezone(), state.settings.clock);
    if (next !== lastClockText) updateClocks();
  }, 1000);

  /* ==========================================================================

     ========================================================================== */
  function initialsFor(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function avatarHue(name) { return hashStr(String(name || 'lume')) % 360; }
  function avatarHTML(size) {
    const s = state.settings;
    if (s.avatar) {
      return '<span style="width:' + size + 'px;height:' + size + 'px;display:block;border-radius:50%;overflow:hidden">' +
        '<img src="' + esc(s.avatar) + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block" /></span>';
    }
    const hue = avatarHue(s.name);
    const bg = 'linear-gradient(145deg, hsl(' + hue + ' 34% 30%), hsl(' + ((hue + 34) % 360) + ' 32% 17%))';
    return '<span style="width:' + size + 'px;height:' + size + 'px;display:grid;place-items:center;border-radius:50%;' +
      'background:' + bg + ';color:hsl(' + hue + ' 60% 88%);font-weight:600;font-size:' + Math.round(size * 0.36) + 'px;' +
      'letter-spacing:-.02em;user-select:none">' + esc(initialsFor(s.name)) + '</span>';
  }
  function processAvatarFile(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !file.type || file.type.indexOf('image/') !== 0) { reject(new Error('That file is not an image.')); return; }
      if (file.size > 12 * 1024 * 1024) { reject(new Error('Images must be smaller than 12 MB.')); return; }
      const reader = new FileReader();
      reader.onerror = function () { reject(new Error('The file could not be read.')); };
      reader.onload = function () {
        const img = new Image();
        img.onerror = function () { reject(new Error('The image could not be decoded.')); };
        img.onload = function () {
          try {
            const SIZE = 256;
            const canvas = document.createElement('canvas');
            canvas.width = SIZE; canvas.height = SIZE;
            const ctx = canvas.getContext('2d');
            const side = Math.min(img.width, img.height);
            ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, SIZE, SIZE);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          } catch (err) { reject(new Error('The image could not be processed.')); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.addEventListener('click', function (e) {
    const target = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!target) return;
    const action = target.dataset.action;

    if (action === 'nav') { navigateTo(target.dataset.page); return; }

    if (action === 'ob-next') {
      if (onboarding.step === 0) {
        if (!onboarding.name.trim()) {
          const input = $('#obName');
          onboarding.name = (input && input.value) ? input.value : 'Friend';
        }
        finishStep0();
      } else {
        onboarding.step += 1;
        onboarding.tzOpen = false;
        render();
        focusOnboardingStep();
      }
      return;
    }
    if (action === 'ob-skip-avatar') { onboarding.avatar = null; onboarding.step = 2; onboarding.tzOpen = true; render(); focusOnboardingStep(); return; }
    if (action === 'ob-clear-avatar') { onboarding.avatar = null; render(); return; }
    if (action === 'ob-set-tz') { onboarding.timezone = target.dataset.value; onboarding.tzQuery = ''; onboarding.tzOpen = false; render(); return; }
    if (action === 'ob-skip-tz') { onboarding.timezone = 'Europe/London'; onboarding.step = 3; render(); focusOnboardingStep(); return; }
    if (action === 'ob-set-clock') { onboarding.clock = target.dataset.value === '12' ? '12' : '24'; render(); return; }
    if (action === 'ob-finish') { finishOnboarding(); return; }

    if (action === 'about-blank') { openInAboutBlank(); return; }

    if (action === 'open-game') {
      const game = GAMES.find(function (g) { return g.id === target.dataset.id; });
      launchGame(game);
      return;
    }
    if (action === 'clear-search') {
      gamesQuery = '';
      render();
      const input = $('#gameSearch');
      if (input) input.focus();
      return;
    }
    if (action === 'frame-external' || action === 'embed-external') {
      const url = safeUrl(target.dataset.url);
      if (!url) { toast('That link is not a valid http or https address.', 'error'); return; }
      const w = window.open(url, '_blank', 'noopener,noreferrer');
      if (!w) toast('Your browser blocked the new tab.', 'error', 5000);
      return;
    }
    if (action === 'close-overlay') { closeOverlay(); return; }
    if (action === 'embed-close') { $('#overlay-root').innerHTML = ''; return; }
    if (action === 'fullscreen-frame') {
      const iframe = $('#frameBody iframe');
      if (iframe) {
        const req = iframe.requestFullscreen || iframe.webkitRequestFullscreen ||
                    iframe.mozRequestFullScreen || iframe.msRequestFullscreen;
        if (req) {
          try { req.call(iframe); } catch (err) { toast('Fullscreen is not available here.', 'info', 3500); }
        } else {
          toast('Fullscreen is not supported by this browser.', 'info', 3500);
        }
      }
      return;
    }

    if (action === 'edit-profile') {
      profileEditing = true;
      render();
      const input = $('#pName');
      if (input) { input.focus(); input.select(); }
      return;
    }
    if (action === 'cancel-profile') { profileEditing = false; render(); return; }
    if (action === 'remove-avatar') { setSettings({ avatar: null }); toast('Profile picture removed.', 'info', 2500); return; }
    if (action === 'open-tz-picker') { openTimezoneModal(); return; }
    if (action === 'set-clock') { setSettings({ clock: target.dataset.value === '12' ? '12' : '24' }); return; }

    if (action === 'set-panel') { settingsPanel = target.dataset.panel; render(); return; }
    if (action === 'set-mode') { setSettings({ mode: target.dataset.value }); return; }
    if (action === 'set-theme') { setSettings({ theme: target.dataset.value, accent: null }); return; }
    if (action === 'clear-accent') { setSettings({ accent: null }); return; }
    if (action === 'set-density') { setSettings({ density: target.dataset.value }); return; }
    if (action === 'set-background') { setSettings({ background: target.dataset.value }); return; }
    if (action === 'toggle-cursor') {
      if (!hasFinePointer()) { toast('A custom cursor needs a mouse or trackpad.', 'info', 3500); return; }
      setSettings({ cursor: !state.settings.cursor });
      return;
    }
    if (action === 'toggle-quickexit') { setSettings({ quickExit: { enabled: !state.settings.quickExit.enabled } }); return; }
    if (action === 'set-qe-behavior') { setSettings({ quickExit: { behavior: target.dataset.value === 'embed' ? 'embed' : 'tab' } }); return; }
    if (action === 'capture-key') { e.preventDefault(); captureFocus(); beginCapture(target.dataset.target, target); return; }
    if (action === 'test-quickexit') {
      const q = state.settings.quickExit;
      if (!q.enabled) { toast('Enable Quick Exit first.', 'info', 3000); return; }
      if (!safeUrl(q.url)) { toast('Add a valid destination URL first.', 'error', 4000); return; }
      triggerQuickExit();
      return;
    }
    if (action === 'reset-shortcuts') {
      setSettings({ shortcuts: Object.assign({}, DEFAULT_SHORTCUTS) });
      toast('Shortcuts restored to defaults.', 'ok', 2500);
      return;
    }
    if (action === 'rerun-onboarding') {
      onboarding.step = 0;
      onboarding.name = state.settings.name || '';
      onboarding.avatar = state.settings.avatar;
      onboarding.timezone = state.settings.timezone;
      onboarding.clock = state.settings.clock;
      onboarding.tzOpen = false;
      onboarding.tzQuery = '';
      setSettings({ onboarded: false });
      render();
      return;
    }
    if (action === 'export-settings') { exportSettings(); return; }
    if (action === 'reset-all') { confirmReset(); return; }
  });

  function finishStep0() {
    onboarding.name = onboarding.name.trim() || 'Friend';
    onboarding.step = 1;
    render();
    focusOnboardingStep();
  }
  function focusOnboardingStep() {
    window.setTimeout(function () {
      const el = $('#obName') || $('.onboard .btn-primary');
      if (el) el.focus();
    }, 60);
  }

  document.addEventListener('input', function (e) {
    const el = e.target;
    if (!el || !el.dataset) return;
    const key = el.dataset.input;
    if (key === 'ob-name') { onboarding.name = el.value; return; }
    if (key === 'ob-tz-search') {
      onboarding.tzQuery = el.value;
      onboarding.tzOpen = true;
      const wrap = el.closest('.tz-wrap');
      const list = wrap ? wrap.querySelector('.tz-list') : null;
      if (list) list.innerHTML = timezoneOptionsHTML(el.value);
      else render();
      return;
    }
    if (key === 'game-search') {
      gamesQuery = el.value;
      const results = $('#gamesResults');
      if (results) {
        results.innerHTML = gamesResultsHTML();
        refreshIcons(results);
      }
      return;
    }
    if (key === 'accent-color') {
      setSettings({ accent: el.value }, { render: false });
      const clearBtn = document.querySelector('[data-action="clear-accent"]');
      if (!clearBtn) render();
      return;
    }
    if (key === 'tab-title') { setSettings({ tabTitle: el.value }, { render: false }); return; }
    if (key === 'qe-url') {
      const valid = !el.value.trim() || !!safeUrl(el.value);
      el.setAttribute('aria-invalid', valid ? 'false' : 'true');
      setSettings({ quickExit: { url: el.value } }, { render: false });
      return;
    }
  });

  document.addEventListener('change', function (e) {
    const el = e.target;
    if (!el || !el.dataset) return;
    const key = el.dataset.input;
    if (key === 'tab-preset') { setSettings({ tabPreset: el.value }); return; }
    if (key === 'ob-avatar' || key === 'profile-avatar') {
      const file = el.files && el.files[0];
      if (!file) return;
      processAvatarFile(file).then(function (dataUrl) {
        if (key === 'ob-avatar') { onboarding.avatar = dataUrl; render(); }
        else { setSettings({ avatar: dataUrl }); toast('Profile picture updated.', 'ok', 2500); }
      }).catch(function (err) {
        toast(err.message || 'That image could not be used.', 'error', 4500);
      });
      el.value = '';
      return;
    }
    if (key === 'import-settings') {
      const file = el.files && el.files[0];
      if (!file) return;
      importSettings(file);
      el.value = '';
      return;
    }
  });

  document.addEventListener('submit', function (e) {
    const form = e.target;
    if (!form || !form.dataset || !form.dataset.form) return;
    e.preventDefault();
    if (form.dataset.form === 'ob-name') {
      const input = $('#obName');
      if (input) onboarding.name = input.value;
      if (!onboarding.name.trim()) {
        toast('Enter a name to continue — or press Continue to use “Friend”.', 'info', 4000);
        return;
      }
      finishStep0();
      return;
    }
    if (form.dataset.form === 'profile') {
      const nameInput = $('#pName');
      const value = nameInput ? nameInput.value.trim() : state.settings.name;
      profileEditing = false;
      setSettings({ name: value || 'Friend' });
      toast('Profile updated.', 'ok', 2500);
      return;
    }
  });

  document.addEventListener('mousedown', function (e) {
    if (!onboarding.tzOpen) return;
    const wrap = e.target.closest ? e.target.closest('.tz-wrap') : null;
    if (!wrap) { onboarding.tzOpen = false; render(); }
  });

  function exportSettings() {
    try {
      const payload = {
        app: 'Lume', version: 1,
        exportedAt: new Date().toISOString(),
        settings: state.settings, recent: state.recent
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'lume-settings.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('Settings exported.', 'ok', 2500);
    } catch (e) { toast('The export could not be created.', 'error', 4000); }
  }
  function importSettings(file) {
    const reader = new FileReader();
    reader.onerror = function () { toast('That file could not be read.', 'error', 4000); };
    reader.onload = function () {
      try {
        const parsed = JSON.parse(String(reader.result));
        const incoming = parsed && parsed.settings ? parsed.settings : parsed;
        if (!incoming || typeof incoming !== 'object') throw new Error('bad');
        const merged = Object.assign({}, state.settings, normalizeSettings(incoming));
        merged.onboarded = true;
        state.settings = normalizeSettings(merged);
        state.settings.createdAt = state.settings.createdAt || Date.now();
        if (Array.isArray(parsed && parsed.recent)) {
          state.recent = parsed.recent.filter(function (id) {
            return typeof id === 'string' && GAMES.some(function (g) { return g.id === id; });
          }).slice(0, 8);
        }
        saveStore();
        applySettings();
        render();
        toast('Settings imported.', 'ok', 3000);
      } catch (e) {
        toast('That file is not a valid Lume settings export.', 'error', 4500);
      }
    };
    reader.readAsText(file);
  }
  function confirmReset() {
    mountOverlay(
      '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="resetTitle">' +
        '<div class="modal modal--sm">' +
          '<div class="modal-head">' +
            '<span class="ic" style="color:var(--danger)"><i data-lucide="alert-triangle"></i></span>' +
            '<div class="modal-title" id="resetTitle">Reset Lume?</div>' +
          '</div>' +
          '<div class="modal-content-pad">' +
            '<p style="font-size:13.5px;color:var(--fg-muted);line-height:1.6">' +
              'This removes your name, profile picture, time zone, theme, cursor settings, shortcuts and play history ' +
              'from this browser. It cannot be undone.</p>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-ghost" type="button" data-action="close-overlay">Cancel</button>' +
            '<button class="btn btn-danger" type="button" id="confirmReset">Reset everything</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
    const btn = $('#confirmReset');
    if (btn) {
      btn.addEventListener('click', function () {
        try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* noop */ }
        state.settings = normalizeSettings(null);
        state.settings.createdAt = Date.now();
        state.recent = [];
        profileEditing = false;
        settingsPanel = 'appearance';
        onboarding.step = 0; onboarding.name = ''; onboarding.avatar = null;
        onboarding.timezone = 'Europe/London'; onboarding.clock = '24';
        closeOverlay();
        applySettings();
        render();
        toast('Lume has been reset.', 'ok', 3000);
      });
    }
  }

  function openTimezoneModal() {
    const zones = timezoneList();
    const current = state.settings.timezone;
    const listHTML = zones.map(function (z) {
      return '<button class="tz-opt" type="button" data-action="choose-tz" data-value="' + esc(z) + '">' +
        '<span>' + esc(z.split('/').slice(-1)[0].replace(/_/g, ' ')) + '</span>' +
        '<small>' + esc(z) + '</small></button>';
    }).join('');
    mountOverlay(
      '<div class="overlay" role="dialog" aria-modal="true" aria-label="Choose time zone">' +
        '<div class="modal modal--sm" style="max-height:76vh">' +
          '<div class="modal-head">' +
            '<span class="ic" style="color:var(--accent)"><i data-lucide="globe"></i></span>' +
            '<div class="modal-title">Time zone</div>' +
            '<div class="modal-head-actions">' +
              '<button class="btn btn-sm btn-icon btn-ghost" type="button" data-action="close-overlay" aria-label="Close">' +
                '<span class="ic"><i data-lucide="x"></i></span></button>' +
            '</div>' +
          '</div>' +
          '<div class="modal-content-pad" style="padding-bottom:10px">' +
            '<label class="sr-only" for="tzModalSearch">Search time zones</label>' +
            '<input id="tzModalSearch" class="input" type="search" placeholder="Search time zones…" ' +
              'autocomplete="off" data-input="tz-modal-search" />' +
            '<p class="hint" style="margin-top:9px">Currently: <strong>' + esc(current) + '</strong></p>' +
          '</div>' +
          '<div style="overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:2px" id="tzModalList">' +
            listHTML +
          '</div>' +
        '</div>' +
      '</div>'
    );
    const search = $('#tzModalSearch');
    if (search) {
      search.addEventListener('input', function () {
        const q = search.value.trim().toLowerCase();
        const list = $('#tzModalList');
        if (!list) return;
        const filtered = q ? zones.filter(function (z) { return z.toLowerCase().indexOf(q) >= 0; }) : zones;
        list.innerHTML = filtered.slice(0, 200).map(function (z) {
          return '<button class="tz-opt" type="button" data-action="choose-tz" data-value="' + esc(z) + '">' +
            '<span>' + esc(z.split('/').slice(-1)[0].replace(/_/g, ' ')) + '</span>' +
            '<small>' + esc(z) + '</small></button>';
        }).join('') || '<div class="tz-empty">No matches.</div>';
      });
      window.setTimeout(function () { search.focus(); }, 80);
    }
  }
  document.addEventListener('click', function (e) {
    const target = e.target.closest ? e.target.closest('[data-action="choose-tz"]') : null;
    if (!target) return;
    const tz = target.dataset.value;
    if (!isValidTimezone(tz)) { toast('That time zone could not be applied.', 'error', 4000); return; }
    closeOverlay();
    setSettings({ timezone: tz });
    toast('Time zone set to ' + tz + '.', 'ok', 2500);
  });

  /* ==========================================================================
     PRELOAD — cache all game logos upfront
     ========================================================================== */
  function preloadGameImages() {
    if (!hasFinePointer() && !navigator.onLine) return;
    const seen = {};
    GAMES.forEach(function (g) {
      const logo = logoUrlFor(g.url);
      if (!logo || seen[logo]) return;
      seen[logo] = 1;
      const img = new Image();
      img.decoding = 'async';
      try { img.fetchPriority = 'low'; } catch (e) { /* noop */ }
      img.referrerPolicy = 'no-referrer';
      img.src = logo;
    });
  }

  /* ==========================================================================
     SYSTEM THEME LISTENER
     ========================================================================== */
  try {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const handler = function () { if (state.settings.mode === 'system') applySettings(); };
    if (typeof mq.addEventListener === 'function') mq.addEventListener('change', handler);
    else if (typeof mq.addListener === 'function') mq.addListener(handler);
  } catch (e) { /* noop */ }

  /* ==========================================================================
     BOOT
     ========================================================================== */
  function boot() {
    try {
      if (window.location.hash || window.location.search) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    } catch (e) { /* noop */ }

    loadStore();
    applySettings();
    render();

    // Kick off image preloading shortly after first paint so the initial
    // render is not competing with 200+ requests.
    window.setTimeout(preloadGameImages, 400);

    const splash = $('#splash');
    const delay = prefersReducedMotion() ? 60 : 520;
    window.setTimeout(function () {
      if (!splash) return;
      splash.classList.add('is-gone');
      window.setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 460);
    }, delay);

    if (!storageAvailable) {
      window.setTimeout(function () {
        toast('Browser storage is unavailable — Lume will run, but your settings will not be saved.', 'error', 7000);
      }, 900);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();
</script>
</body>
</html>
