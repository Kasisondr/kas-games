<style>
body { margin:0; font-family:sans-serif; background:#121212; color:#f0f0f0; }
button { cursor:pointer; transition:0.2s; }
h1,h2 { margin-bottom:10px; }
#theme-toggle { position:fixed; top:10px; right:10px; padding:10px; background:#282828; border:none; border-radius:5px; color:white; }
#welcome-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center; }
.welcome-buttons { display:flex; flex-wrap:wrap; gap:15px; margin-top:20px; }
.welcome-buttons button { padding:15px 25px; border:none; border-radius:10px; background:#282828; color:white; font-size:1.2em; }
.section { display:none; padding:20px; }
.section.active { display:block; }
#search-bar { width:100%; max-width:500px; padding:10px 15px; margin-bottom:20px; border-radius:10px; border:none; font-size:1em; }
.button-container { display:flex; flex-wrap:wrap; gap:10px; }
.game-card, .apps-card { width:150px; background:#1f1f1f; padding:10px; border-radius:10px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.game-card img, .apps-card img { width:80px; height:80px; object-fit:contain; margin-bottom:10px; }
.game-card button, .apps-card button { margin-top:auto; padding:5px 10px; border:none; border-radius:5px; background:#282828; color:white; width:100%; }
#game-window { display:none; flex-direction:column; align-items:center; justify-content:center; padding:10px; background:#1f1f1f; border-radius:10px; margin:20px; width:calc(100% - 40px); }
#game-window iframe { width:100%; height:600px; border:none; border-radius:10px; }
#game-controls { display:flex; justify-content:space-between; width:100%; max-width:900px; margin-top:10px; }
#game-controls button { padding:5px 10px; border:none; border-radius:5px; background:#282828; color:white; }

// Placeholder icons
function generatePlaceholderIcon(name){
    const canvas=document.createElement('canvas'); canvas.width=80; canvas.height=80;
    const ctx=canvas.getContext('2d'); ctx.fillStyle='black'; ctx.fillRect(0,0,80,80);
    ctx.fillStyle='white'; ctx.font='bold 40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(name[0].toUpperCase(),40,40); return canvas.toDataURL();
}

// Render items
function renderItems(containerId, items, isGame=true){
    const container=document.getElementById(containerId); container.innerHTML='';
    items.forEach(item=>{
        const card=document.createElement('div'); card.className=isGame?'game-card':'apps-card';
        const img=document.createElement('img'); img.src=generatePlaceholderIcon(item.name);
        const btn=document.createElement('button'); btn.innerText=item.name;
        btn.onclick=()=>openItem(item,isGame);
        card.appendChild(img); card.appendChild(btn); container.appendChild(card);
    });
}

// Open game/app/flash/unblocker
function openItem(item,isGame=true){
    if(isGame){ document.getElementById('games-container').style.display='none'; }
    else { document.getElementById('apps-container').style.display='none'; document.getElementById('flash-container').style.display='none'; document.getElementById('unblockers-container').style.display='none'; }
    document.getElementById('game-title').innerText=item.name;
    document.getElementById('game-frame').src=item.url;
    document.getElementById('game-window').style.display='flex';
}

// Close game
function closeGame(){
    document.getElementById('game-window').style.display='none';
    document.getElementById('game-frame').src='';
    document.getElementById('games-container').style.display='flex';
    document.getElementById('apps-container').style.display='flex';
    document.getElementById('flash-container').style.display='flex';
    document.getElementById('unblockers-container').style.display='flex';
}

// Fullscreen
function toggleFullscreen(){ const el=document.getElementById('game-frame'); if(el.requestFullscreen) el.requestFullscreen(); else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); }

// Like/dislike
function likeGame(){ alert('Liked!'); }
function dislikeGame(){ alert('Disliked!'); }

// Show section
function showSection(sectionId){
    document.querySelectorAll('.section').forEach(sec=>sec.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    document.getElementById('welcome-screen').style.display='none';
}

// Search filter
function filterItems(){
    const query=document.getElementById('search-bar').value.toLowerCase();
    document.querySelectorAll('.game-card, .apps-card').forEach(card=>{
        card.style.display=card.querySelector('button').innerText.toLowerCase().includes(query)?'flex':'none';
    });
}

// Players online
function updatePlayersOnline(){
    const count=Math.floor(Math.random()*500)+50; // realistic random online count
    document.getElementById('online-count').innerText=count;
}
