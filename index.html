<style>
/* Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=Mulish&display=swap');

/* Theme variables */
:root {
    --text-color: #fff;
    --bg-1: #5a189a;    /* purple base */
    --bg-2: #10002b;    /* dark purple background */
    --color-1: #E0AAFF; /* light purple accent */
    --color-2: #7B2CBF; /* medium purple accent */
    --color-3: #3C096C; /* dark purple accent */
    --color-4: #240046; /* nearly black purple */
}

/* Base body styles */
body {
    margin: 0;
    font-family: 'Mulish', sans-serif;
    background-color: var(--bg-2);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    transition: background 0.5s, color 0.5s;
    user-select: none;
}

/* Headings */
h1 { font-size: 48px; margin: 10px; }
h2 { font-size: 32px; margin: 8px; }
h3 { font-size: 24px; margin: 4px; }

/* Links */
a { color: var(--text-color); text-decoration: none; }

/* Buttons */
button {
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Mulish', sans-serif;
}

/* Settings button */
#settings-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 10px;
    background: var(--color-3);
    border: none;
    border-radius: 5px;
    color: var(--text-color);
    z-index: 1000;
}

/* Welcome screen */
#welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
}

/* Welcome buttons */
.welcome-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 20px;
}

.welcome-buttons button {
    padding: 15px 25px;
    border-radius: 10px;
    background: var(--color-4);
    color: var(--text-color);
    font-size: 1.2em;
    transition: background 0.3s, transform 0.2s;
}

.welcome-buttons button:hover {
    background: var(--color-2);
    transform: scale(1.05);
}

/* Sections */
.section {
    display: none;
    padding: 20px;
}
.section.active {
    display: block;
}

/* Back button */
.back-btn {
    margin-bottom: 20px;
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    background: var(--color-3);
    color: var(--text-color);
}

/* Search bar */
#search-bar {
    width: 100%;
    max-width: 500px;
    padding: 12px 18px;
    margin: 20px auto;
    border-radius: 12px;
    border: none;
    font-size: 1em;
    background: color-mix(in srgb, var(--color-4) 50%, var(--bg-2) 50%);
    color: var(--text-color);
    display: block;
    transition: background 0.3s, color 0.3s;
}

/* Container for cards */
.button-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

/* Cards */
.game-card, .apps-card {
    width: 150px;
    background: color-mix(in srgb, var(--color-3) 30%, var(--color-4) 70%);
    padding: 10px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: background 0.3s, transform 0.2s;
}

.game-card:hover, .apps-card:hover {
    background: var(--color-2);
    transform: scale(1.05);
}

/* Card images */
.game-card img, .apps-card img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    margin-bottom: 10px;
}

/* Card buttons */
.game-card button, .apps-card button {
    margin-top: auto;
    padding: 5px 10px;
    border-radius: 5px;
    background: var(--color-4);
    color: var(--text-color);
    width: 100%;
    transition: background 0.3s, transform 0.2s;
}

.game-card button:hover, .apps-card button:hover {
    background: var(--color-2);
    transform: scale(1.05);
}

/* Game window */
#game-window {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    background: color-mix(in srgb, var(--color-3) 40%, var(--bg-2) 60%);
    border-radius: 10px;
    margin: 20px;
    width: calc(100% - 40px);
    transition: background 0.5s;
}

#game-window iframe {
    width: 100%;
    height: 600px;
    border: none;
    border-radius: 10px;
}

/* Game controls */
#game-controls {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 900px;
    margin-top: 10px;
}

#game-controls button {
    padding: 5px 10px;
    border-radius: 5px;
    background: var(--color-4);
    color: var(--text-color);
    transition: background 0.3s, transform 0.2s;
}

#game-controls button:hover {
    background: var(--color-2);
    transform: scale(1.05);
}

/* Theme modal */
#theme-modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg-2);
    color: var(--text-color);
    border-radius: 15px;
    padding: 20px;
    z-index: 2000;
    min-width: 300px;
}

.theme-option {
    padding: 10px;
    margin: 5px 0;
    border-radius: 8px;
    cursor: pointer;
    background: var(--color-4);
    text-align: center;
}
.theme-option:hover {
    background: var(--color-2);
}
</style>
</head>

    <div class="theme-option" onclick="toggleThemeModal()">Close</div>

<script>
// Section tracking
let lastSection = null;

// Show section
function showSection(sectionId){
    document.querySelectorAll('.section').forEach(sec=>sec.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    document.getElementById('welcome-screen').style.display='none';
    lastSection = sectionId;
}

// Back to main
function backToMain(btn){
    btn.parentElement.classList.remove('active');
    document.getElementById('welcome-screen').style.display='flex';
}

// Game window
function openItem(item){
    document.getElementById('games-container').style.display='none';
    document.getElementById('apps-container').style.display='none';
    document.getElementById('flash-container').style.display='none';
    document.getElementById('unblockers-container').style.display='none';
    document.getElementById('game-title').innerText = item.name;
    document.getElementById('game-frame').src = item.url;
    document.getElementById('game-window').style.display='flex';
}
function closeGame(){
    document.getElementById('game-window').style.display='none';
    document.getElementById('game-frame').src='';
    if(lastSection) document.getElementById(lastSection).style.display='flex';
    else document.getElementById('welcome-screen').style.display='flex';
}
function toggleFullscreen(){
    const el = document.getElementById('game-frame');
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
function likeGame(){ alert('Liked!'); }
function dislikeGame(){ alert('Disliked!'); }

// Search
function filterItems(){
    const query = document.getElementById('search-bar').value.toLowerCase();
    const container = lastSection ? document.getElementById(lastSection + '-container') : null;
    if(!container) return;
    container.querySelectorAll('.game-card, .apps-card').forEach(card=>{
        card.style.display = card.querySelector('button').innerText.toLowerCase().includes(query) ? 'flex' : 'none';
    });
}

// Theme modal
function toggleThemeModal(){
    const modal = document.getElementById('theme-modal');
    modal.style.display = modal.style.display==='block'?'none':'block';
}

// Theme apply
function applyTheme(color){
    const root = document.documentElement;
    if(color==='purple'){
        root.style.setProperty('--bg-1','#5a189a');
        root.style.setProperty('--bg-2','#10002b');
        root.style.setProperty('--color-1','#E0AAFF');
        root.style.setProperty('--color-2','#7B2CBF');
        root.style.setProperty('--color-3','#3C096C');
        root.style.setProperty('--color-4','#240046');
    } else if(color==='blue'){
        root.style.setProperty('--bg-1','#0d6efd');
        root.style.setProperty('--bg-2','#03045e');
        root.style.setProperty('--color-1','#90e0ef');
        root.style.setProperty('--color-2','#00b4d8');
        root.style.setProperty('--color-3','#0077b6');
        root.style.setProperty('--color-4','#023e8a');
    } else if(color==='green'){
        root.style.setProperty('--bg-1','#38b000');
        root.style.setProperty('--bg-2','#004d00');
        root.style.setProperty('--color-1','#b7e4c7');
        root.style.setProperty('--color-2','#70e000');
        root.style.setProperty('--color-3','#2a9d8f');
        root.style.setProperty('--color-4','#145214');
    }
    toggleThemeModal();
}

// Players online
function updatePlayersOnline(){
    const count=Math.floor(Math.random()*500)+50;
    document.getElementById('online-count').innerText = count;
}
setInterval(updatePlayersOnline,5000);
updatePlayersOnline();

// Render placeholder cards
function generatePlaceholderIcon(name){
    const canvas=document.createElement('canvas'); canvas.width=80; canvas.height=80;
    const ctx=canvas.getContext('2d'); ctx.fillStyle='black'; ctx.fillRect(0,0,80,80);
    ctx.fillStyle='white'; ctx.font='bold 40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(name[0].toUpperCase(),40,40); return canvas.toDataURL();
}
function renderItems(containerId, items){
    const container=document.getElementById(containerId);
    container.innerHTML='';
    items.forEach(item=>{
        const card=document.createElement('div'); 
        card.className=containerId.includes('apps') ? 'apps-card' : 'game-card';
        const img=document.createElement('img'); img.src=generatePlaceholderIcon(item.name);
        const btn=document.createElement('button'); btn.innerText=item.name;
        btn.onclick=()=>openItem(item);
        card.appendChild(img); card.appendChild(btn); container.appendChild(card);
    });
}
